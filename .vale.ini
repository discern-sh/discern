StylesPath = .vale

MinAlertLevel = suggestion

Packages = Microsoft, proselint

# Project vocabulary — terms Vale's dictionary doesn't know (worktree, gitignored,
# stdout, Deno, …), kept in .vale/config/vocabularies/Project/accept.txt. That file
# is authored and tracked; the synced Packages above are not (see .gitignore).
Vocab = Project

[*.{md}]
# This section applies to Markdown only. To cover more file types, widen the
# extension list, e.g. [*.{md,rst}].
BasedOnStyles = Vale, Microsoft, proselint

# House-style overrides — rules where this project has deliberately chosen the
# other convention. Turned off so an `error`-level alert always means a real
# defect, not a style disagreement. Re-enable any by deleting its line.
#
#   Dashes       — we write spaced em-dashes ( — ); Microsoft wants them tight.
#   Contractions — it forces "it's"/"can't"; our reference prose keeps full forms.
#   Terms        — substitutes domain words wrongly (e.g. "agent" → "personal
#                  digital assistant"); "agent" is core vocabulary here.
#   Foreign      — flags "e.g."/"i.e."; standard in our technical prose.
#   Quotes       — wants punctuation inside quotes; we quote logically, so a
#                  quoted literal never absorbs a stray comma or period.
#   Auto         — wants "autogenerated"; we consistently hyphenate auto-*.
Microsoft.Dashes = NO
Microsoft.Contractions = NO
Microsoft.Terms = NO
Microsoft.Foreign = NO
Microsoft.Quotes = NO
Microsoft.Auto = NO

# Two more Microsoft rules that fight deliberate conventions:
#   Plurals       — flags the "(s)" notation; we use it for config values that
#                   take one item or a list (string | string[]).
#   HeadingColons — wants the word after a heading colon capitalized; conflicts
#                   with the lowercase "discern" brand and our sentence-style heads.
Microsoft.Plurals = NO
Microsoft.HeadingColons = NO

# Vale.Terms enforces each Vocab entry as a *canonical term* (casing + exact
# form). Our accept.txt uses regexes for plurals (worktrees?, configs?), so it
# emits nonsense ("Use 'worktrees?' instead of 'Worktree'") and forbids
# legitimate sentence-initial capitals. The vocab is a spelling accept-list, not
# a term-canonicalizer — those are separate jobs. Off until we author a proper
# term list deliberately, if ever.
Vale.Terms = NO

# proselint.Annotations flags TODO/FIXME/NOTE markers left in prose. But this is
# a dev-tooling project that keeps a TODO.md, references it constantly, and
# writes *about* those markers — so every hit here is the word-as-subject, not
# an unfinished note. Signal for most projects; noise for this one.
proselint.Annotations = NO

# Private docs are not linted. Anything under project/map/_private/ (research notes,
# drafts, marketing) is unshipped and citation-heavy — external names and URLs
# that aren't our vocabulary — so it carries no prose contract. The glob covers
# every current and future _private subfolder; loading no styles skips them.
[project/map/_private/**]
BasedOnStyles =
