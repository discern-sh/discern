StylesPath = .vale

MinAlertLevel = suggestion

Packages = Microsoft, proselint

# Project vocabulary — terms Vale's dictionary doesn't know (worktree, gitignored,
# stdout, Deno, …), kept in .vale/config/vocabularies/Project/accept.txt. That file
# is authored and tracked; the synced Packages above are not (see .gitignore).
Vocab = Project

[*.{md}]
# This section applies to Markdown only. To cover more file types, widen the
# extension list, e.g. [*.{md,rst}].
BasedOnStyles = Vale, Microsoft, proselint

# House-style overrides — rules where this project has deliberately chosen the
# other convention. Turned off so an `error`-level alert always means a real
# defect, not a style disagreement. Re-enable any by deleting its line.
#
#   Dashes       — we write spaced em-dashes ( — ); Microsoft wants them tight.
#   Contractions — it forces "it's"/"can't"; our reference prose keeps full forms.
#   Terms        — substitutes domain words wrongly (e.g. "agent" → "personal
#                  digital assistant"); "agent" is core vocabulary here.
Microsoft.Dashes = NO
Microsoft.Contractions = NO
Microsoft.Terms = NO
