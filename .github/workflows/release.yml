name: release

# Build the per-platform `discern` binaries and attach them to the GitHub
# Release whenever a v* tag is pushed. One native macOS row runs the full gate
# before compilation, so publication never relies only on routine CI.

on:
  push:
    tags:
      - "v*"

# Default every job to read-only; the publish job opts into write below
# (least privilege — only the step that creates the release can write).
permissions:
  contents: read

# Never run two publishes for the same tag at once, and don't interrupt one
# mid-upload — queue a re-run instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: validate release
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
          cache: true

      - name: Validate tag and derive native build matrix
        id: plan
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          deno run --allow-read --allow-write scripts/release_plan.ts
          "${RELEASE_TAG}" "${GITHUB_OUTPUT}"

  build:
    name: build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
          # Cache the Deno install and module cache (keyed off deno.lock).
          cache: true

      # The release target registry selects one existing native row for this
      # gate, avoiding a separate macOS runner while preserving release proof.
      - name: Fetch main for the release gate
        if: ${{ matrix.gateBeforeBuild }}
        run: >-
          git fetch --no-tags --depth=1 origin
          +refs/heads/main:refs/remotes/origin/main

      - name: Run the full gate on native macOS
        if: ${{ matrix.gateBeforeBuild }}
        uses: ./.github/actions/macos-gate
        env:
          DISCERN_TRUNK: origin/main

      - name: Compile ${{ matrix.target }}
        run: deno task build ${{ matrix.target }}

      - name: Install Apple release credentials
        if: ${{ runner.os == 'macOS' }}
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?missing APPLE_DEVELOPER_ID_P12_BASE64 secret}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?missing APPLE_DEVELOPER_ID_P12_PASSWORD secret}"
          : "${APPLE_NOTARY_APPLE_ID:?missing APPLE_NOTARY_APPLE_ID secret}"
          : "${APPLE_NOTARY_PASSWORD:?missing APPLE_NOTARY_PASSWORD secret}"
          : "${APPLE_TEAM_ID:?missing APPLE_TEAM_ID secret}"

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/discern-release.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" \
            | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk '/Developer ID Application:/ {
                  count += 1
                  identity = $2
                }
                END {
                  if (count == 1) print identity
                  else exit 1
                }'
          )"

          xcrun notarytool store-credentials discern-release \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --keychain "$keychain_path"

          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"
          printf 'APPLE_SIGNING_KEYCHAIN=%s\n' "$keychain_path" >> "$GITHUB_ENV"

      - name: Sign ${{ matrix.output }} with Developer ID
        if: ${{ runner.os == 'macOS' }}
        run: >-
          codesign --force --timestamp --options runtime
          --identifier sh.discern.cli
          --entitlements scripts/macos_release_entitlements.plist
          --keychain "${APPLE_SIGNING_KEYCHAIN}"
          --sign "${APPLE_SIGNING_IDENTITY}"
          "dist/${{ matrix.output }}"

      - name: Smoke compiled binary
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          scripts/release_smoke.ts "dist/${{ matrix.output }}"
          "${{ needs.plan.outputs.version }}"

      - name: Notarize ${{ matrix.output }}
        if: ${{ runner.os == 'macOS' }}
        run: |
          archive="$RUNNER_TEMP/${{ matrix.output }}.zip"
          ditto -c -k --keepParent "dist/${{ matrix.output }}" "$archive"
          xcrun notarytool submit "$archive" \
            --keychain-profile discern-release \
            --keychain "${APPLE_SIGNING_KEYCHAIN}" \
            --wait
          codesign --verify --strict --verbose=2 "dist/${{ matrix.output }}"
          codesign -vvvv -R="notarized" --check-notarization \
            "dist/${{ matrix.output }}"

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

      # Free/Pro/Team repositories gain attestations when public. Keep private
      # pre-launch tags usable, but require this step in the public runbook.
      - name: Attest build provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.output }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256
          if-no-files-found: error

      - name: Remove Apple release credentials
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          keychain_path="${APPLE_SIGNING_KEYCHAIN:-$RUNNER_TEMP/discern-release.keychain-db}"
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
          rm -f "$RUNNER_TEMP/${{ matrix.output }}.zip"

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # merge-multiple flattens every artifact straight into dist/ (each
      # filename is already unique per target, so nothing collides) — no
      # separate flatten step needed.
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: dist/discern-*
          fail_on_unmatched_files: true

  deploy-site:
    name: deploy discern.sh from release tag
    needs: [plan, release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
    steps:
      # The workflow has only a v* tag trigger, and this explicit ref keeps the
      # deploy input auditable if checkout ever changes its event defaults.
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
          cache: true

      - name: Build the exact site revision
        run: deno task site:build

      # The production app is created as a local-source app (not linked to the
      # repository's default branch), so this is its only production trigger.
      # deno.json supplies the remote build and runtime configuration.
      - name: Deploy the tag to production
        run: >-
          deno deploy --org "${{ vars.DENO_DEPLOY_ORG }}"
          --app "${{ vars.DENO_DEPLOY_APP }}" --prod
