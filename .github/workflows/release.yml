name: release

# Build the per-platform `discern` binaries and attach them to the GitHub
# Release whenever a v* tag is pushed.

on:
  push:
    tags:
      - "v*"

# Default every job to read-only; the publish job opts into write below
# (least privilege — only the step that creates the release can write).
permissions:
  contents: read

# Never run two publishes for the same tag at once, and don't interrupt one
# mid-upload — queue a re-run instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: validate release
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Validate tag and derive native build matrix
        id: plan
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          deno run --allow-read --allow-write scripts/release_plan.ts
          "${RELEASE_TAG}" "${GITHUB_OUTPUT}"

  build:
    name: build ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # Cache the Deno install and module cache (keyed off deno.lock).
          cache: true

      - name: Compile ${{ matrix.target }}
        run: deno task build ${{ matrix.target }}

      - name: Smoke compiled binary
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          scripts/release_smoke.ts "dist/${{ matrix.output }}"
          "${{ needs.plan.outputs.version }}"

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 "discern-${{ matrix.target }}" > "discern-${{ matrix.target }}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: discern-${{ matrix.target }}
          path: |
            dist/discern-${{ matrix.target }}
            dist/discern-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # merge-multiple flattens every artifact straight into dist/ (each
      # filename is already unique per target, so nothing collides) — no
      # separate flatten step needed.
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/discern-*
          fail_on_unmatched_files: true

  deploy-site:
    name: deploy discern.sh from release tag
    needs: [plan, release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
    steps:
      # The workflow has only a v* tag trigger, and this explicit ref keeps the
      # deploy input auditable if checkout ever changes its event defaults.
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Build the exact site revision
        run: deno task site:build

      # The production app is created as a local-source app (not linked to the
      # repository's default branch), so this is its only production trigger.
      # deno.json supplies the remote build and runtime configuration.
      - name: Deploy the tag to production
        run: >-
          deno deploy --org "${{ vars.DENO_DEPLOY_ORG }}"
          --app "${{ vars.DENO_DEPLOY_APP }}" --prod
