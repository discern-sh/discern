name: release

# Publish a version tag only after the complete gate has proved its exact commit.
# A missing gate is requested once; the completion workflow resumes publication.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      gate_run:
        description: Successful gate run to verify before publication
        required: false
        type: string

# Default every job to read-only; the publish job opts into write below
# (least privilege — only the step that creates the release can write).
permissions:
  contents: read

# Serialize publication and deployment across tags so a stale run cannot
# replace a newer release catalogue or latest stable target.
concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  plan:
    name: validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      make_latest: ${{ steps.plan.outputs.make_latest }}
      matrix: ${{ steps.plan.outputs.matrix }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Require the complete gate for the release commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_GATE_RUN: ${{ inputs.gate_run }}
        run: >-
          deno run --allow-read --allow-write --allow-run=git,gh --allow-env
          scripts/release_gate.ts request "$RELEASE_TAG" "$GITHUB_OUTPUT"

      - name: Observe published releases and assets
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' > "$RUNNER_TEMP/releases.json"

      - name: Validate tag and derive native build matrix
        if: steps.gate.outputs.ready == 'true'
        id: plan
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: >-
          deno run --allow-read --allow-write --allow-run=git --allow-env=REPOSITORY_PRIVATE
          scripts/release_plan.ts
          "${RELEASE_TAG}" "${GITHUB_OUTPUT}"
          "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/release-body.md"

      - name: Validate the candidate site catalogue
        if: steps.gate.outputs.ready == 'true'
        run: deno task site:build

  build:
    timeout-minutes: 270
    name: build ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.ready == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-tags: true
          fetch-depth: 0

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          # Cache the Deno install and module cache (keyed off deno.lock).
          cache: true

      - name: Compile ${{ matrix.target }}
        run: deno task build ${{ matrix.target }}

      - name: Install Apple release credentials
        if: ${{ runner.os == 'macOS' }}
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APPLE_DEVELOPER_ID_P12_BASE64:?missing APPLE_DEVELOPER_ID_P12_BASE64 secret}"
          : "${APPLE_DEVELOPER_ID_P12_PASSWORD:?missing APPLE_DEVELOPER_ID_P12_PASSWORD secret}"
          : "${APPLE_NOTARY_APPLE_ID:?missing APPLE_NOTARY_APPLE_ID secret}"
          : "${APPLE_NOTARY_PASSWORD:?missing APPLE_NOTARY_PASSWORD secret}"
          : "${APPLE_TEAM_ID:?missing APPLE_TEAM_ID secret}"

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/discern-release.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" \
            | base64 --decode -o "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk '/Developer ID Application:/ {
                  count += 1
                  identity = $2
                }
                END {
                  if (count == 1) print identity
                  else exit 1
                }'
          )"

          xcrun notarytool store-credentials discern-release \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --keychain "$keychain_path"

          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$signing_identity" >> "$GITHUB_ENV"
          printf 'APPLE_SIGNING_KEYCHAIN=%s\n' "$keychain_path" >> "$GITHUB_ENV"

      - name: Sign ${{ matrix.output }} with Developer ID
        if: ${{ runner.os == 'macOS' }}
        run: >-
          codesign --force --timestamp --options runtime
          --identifier sh.discern.cli
          --entitlements scripts/macos_release_entitlements.plist
          --keychain "${APPLE_SIGNING_KEYCHAIN}"
          --sign "${APPLE_SIGNING_IDENTITY}"
          "dist/${{ matrix.output }}"

      - name: Smoke compiled binary
        run: >-
          deno run --allow-read --allow-write --allow-run --allow-env
          scripts/release_smoke.ts "dist/${{ matrix.output }}"
          "${{ needs.plan.outputs.version }}"

      - name: Notarize ${{ matrix.output }}
        if: ${{ runner.os == 'macOS' }}
        run: |
          archive="$RUNNER_TEMP/${{ matrix.output }}.zip"
          ditto -c -k --keepParent "dist/${{ matrix.output }}" "$archive"
          xcrun notarytool submit "$archive" \
            --keychain-profile discern-release \
            --keychain "${APPLE_SIGNING_KEYCHAIN}" \
            --wait
          codesign --verify --strict --verbose=2 "dist/${{ matrix.output }}"
          codesign -vvvv -R="notarized" --check-notarization \
            "dist/${{ matrix.output }}"

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 "${{ matrix.output }}" > "${{ matrix.output }}.sha256"

      # Provenance is recorded for every tag: the plan job has already refused
      # any tag on a private repository, so this step carries no condition.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.output }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256
          if-no-files-found: error

      - name: Remove Apple release credentials
        if: ${{ always() && runner.os == 'macOS' }}
        run: |
          keychain_path="${APPLE_SIGNING_KEYCHAIN:-$RUNNER_TEMP/discern-release.keychain-db}"
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
          rm -f "$RUNNER_TEMP/${{ matrix.output }}.zip"

  release:
    name: publish release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          cache: true

      - name: Observe published releases and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --paginate --slurp 'repos/{owner}/{repo}/releases?per_page=100' > "$RUNNER_TEMP/releases.json"

      - name: Derive release body and recheck publication ordering
        id: publication-plan
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: >-
          deno run --allow-read --allow-write --allow-run=git --allow-env=REPOSITORY_PRIVATE
          scripts/release_plan.ts "${RELEASE_TAG}" "${GITHUB_OUTPUT}"
          "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/release-body.md"

      # merge-multiple flattens every binary artifact straight into dist/ (each
      # filename is already unique per target, so nothing collides) — no
      # separate flatten step needed. The pattern keeps the WSL 2 lane's VM
      # samples, a diagnostic artifact of the same run, out of the release.
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: discern-*
          path: dist
          merge-multiple: true

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: dist/discern-*
          fail_on_unmatched_files: true
          name: ${{ steps.publication-plan.outputs.title }}
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: false
          prerelease: ${{ steps.publication-plan.outputs.prerelease }}
          make_latest: ${{ steps.publication-plan.outputs.make_latest }}

  deploy-site:
    name: deploy discern.sh after publication
    needs: [plan, release]
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/site-publish.yml
    # The publisher's production job reads that environment's deploy token,
    # which a called workflow receives only when its caller passes secrets.
    secrets: inherit
