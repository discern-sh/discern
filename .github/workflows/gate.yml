name: gate

# Run the repo's own quality gate — the same `discern finish` developers run —
# on every push to main and every pull request. The trailing `git diff
# --exit-code` turns the auto-fixing `fix` stage (deno fmt) into a hard check: CI
# fixes nothing, it only verifies the committed tree is already clean.
#
# The engine is now TS-native (in the binary), so there is no committed shell
# engine to selfcheck and no `#!/usr/bin/env sh` recipes to run under a dash/bash
# matrix — both of those jobs retired with the single-binary cutover (ADR 0019).

on:
  push:
    branches: [main]
  pull_request:

# The gate only ever reads the repo; grant nothing more (least privilege).
permissions:
  contents: read

# A newer commit supersedes an in-flight run on the same ref. Cancel the stale
# run on pull requests; let main runs finish so every landed commit is gated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pin the Vale version CI installs to lint docs/. Both the [checks.prose] gate
# and the [ratchets.prose] metric shell out to `vale`, so it must be on PATH and
# its styles synced before `discern finish` / `ratchets` run. Bump this alongside
# the Brewfile when upgrading Vale locally.
env:
  VALE_VERSION: "3.15.1"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          # Cache the Deno install and module cache (keyed off deno.lock) so the
          # gate stops re-downloading every dependency on each run.
          cache: true

      # Vale is the linter behind the [checks.prose] gate. Install the pinned
      # binary to /usr/local/bin and sync its styles (Microsoft, proselint) into
      # the gitignored .vale/ before the gate runs.
      - name: Install Vale and sync its styles
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale sync

      - name: Run the gate (discern finish, via the dev binary)
        run: deno task dev finish

      - name: Assert a clean tree (the fix stage must change nothing in CI)
        run: git diff --exit-code

  ratchets:
    # Hold the metric ratchets (coverage, …). They run the whole suite under
    # coverage instrumentation, so they are deliberately NOT part of the gate.
    # Enforce them on PULL REQUESTS only: every PR must hold the floor, while
    # direct pushes to main stay fast (whatever landed already passed on its PR).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      # The "never loosen vs main" half of each ratchet reads `main:discern.toml`
      # (with a legacy `.discern/config.toml` fallback). A PR checkout does not
      # carry the base branch, so fetch its tip; the check self-skips if it is
      # still unavailable (e.g. before the ratchet is on main).
      - name: Fetch main for the never-loosen comparison
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/heads/main || true

      # The prose ratchet measures with Vale; install + sync it like the gate job.
      - name: Install Vale and sync its styles
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale sync

      - name: Hold the ratchets
        run: deno task dev ratchets
