name: gate

# Run the repo's own quality gate — the same `./bin/agent finish`
# developers run — on every push to main and every pull request. The trailing
# `git diff --exit-code` turns the auto-fixing `fix` phase (deno fmt) into a hard
# check: CI fixes nothing, it only verifies the committed tree is already clean.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run the gate
        run: ./bin/agent finish

      - name: Assert a clean tree (the fix phase must change nothing in CI)
        run: git diff --exit-code
