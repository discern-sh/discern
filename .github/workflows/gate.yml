name: gate

# Run the repo's own quality gate — the same `discern done` developers run —
# on every push to main and every pull request. The trailing `git diff
# --exit-code` turns the auto-fixing `fix` stage (deno fmt) into a hard check: CI
# fixes nothing, it only verifies the committed tree is already clean.
#
# The engine is TS-native (in the binary), so there is no committed shell engine
# or shell recipe matrix. The standalone remote installer remains POSIX shell and
# is linted in the gate.

on:
  push:
    branches: [main]
  pull_request:

# The gate only ever reads the repo; grant nothing more (least privilege).
permissions:
  contents: read

# A newer commit supersedes an in-flight run...
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin the Vale version CI installs to lint the configured map. Both [jobs.prose]
# and the [standards.prose] metric shell out to `vale`, so it must be on PATH and
# its styles synced before `discern done` / `standards` run. Bump this alongside
# the Brewfile when upgrading Vale locally.
env:
  VALE_VERSION: "3.15.1"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
          # Cache the Deno install and module cache (keyed off deno.lock) so the
          # gate stops re-downloading every dependency on each run.
          cache: true

      # Vale is the linter behind the [jobs.prose] gate. Install the pinned
      # binary to /usr/local/bin and sync its styles (Microsoft, proselint) into
      # the gitignored .vale/ before the gate runs.
      - name: Install Vale and sync its styles
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale sync

      - name: Lint the remote installer
        run: shellcheck install.sh

      - name: Run the gate (discern done, via the dev binary)
        run: deno task dev done

      - name: Assert a clean tree (the fix stage must change nothing in CI)
        run: git diff --exit-code

  standards:
    # Hold the metric standards (coverage, …). They run the whole suite under
    # coverage instrumentation, so they are deliberately NOT part of the gate.
    # Enforce them on PULL REQUESTS only: every PR must hold the floor, while
    # direct pushes to main stay fast (whatever landed already passed on its PR).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
          cache: true

      # The "never loosen vs main" half of each standard reads `main:discern.toml`
      # (with a legacy `.discern/config.toml` fallback). A PR checkout does not
      # carry the base branch, so fetch its tip; the check self-skips if it is
      # still unavailable (e.g. before the standard is on main).
      - name: Fetch main for the never-loosen comparison
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/heads/main || true

      # The prose standard measures with Vale; install + sync it like the gate job.
      - name: Install Vale and sync its styles
        run: |
          curl -sfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale sync

      - name: Hold the standards
        run: deno task dev standards
