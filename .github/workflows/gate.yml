name: gate

# Run the repo's own machine gate under the explicit CI review-report lane on
# every push to main and every pull request. Ubuntu covers private
# development; native macOS and WSL 2 join routine CI once the repository is
# public. The release workflow repeats both gates before every publication.
#
# The engine is TS-native (in the binary), so there is no committed shell engine
# or shell recipe matrix. The standalone remote installer remains POSIX shell and
# is linted in the gate.

on:
  push:
    branches: [main]
  pull_request:
  # Ad-hoc runs while the repository is private: dispatch runs the Ubuntu gate
  # and forces the WSL lane (see its job condition below).
  workflow_dispatch:

# The gate only ever reads the repo; grant nothing more (least privilege).
permissions:
  contents: read

# A newer commit supersedes an in-flight run. Remote gates are long enough that
# finishing an obsolete tree would spend almost a second run's worth of minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch main for baseline checks
        run: |
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main refs/remotes/origin/main
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
          # Cache the Deno install and module cache (keyed off deno.lock) so the
          # gate stops re-downloading every dependency on each run.
          cache: true

      # Vale is the linter behind the [jobs.prose] gate. Install the pinned
      # binary to /usr/local/bin and sync its styles (Microsoft, proselint) into
      # the gitignored .vale/ before the gate runs.
      - name: Install Vale and sync its styles
        run: |
          VALE_VERSION="$(<.vale-version)"
          curl -sfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale sync

      - name: Lint the remote installer
        run: shellcheck install.sh

      - name: Run the gate (discern done --ci, via the dev binary)
        env:
          DISCERN_GATE_TEST_REPORTER: pretty
        run: deno task dev done --ci

      - name: Assert a clean tree (the fix stage must change nothing in CI)
        run: git diff --exit-code

  macos:
    name: macOS gate
    # Private development already carries local macOS gate proofs. Keep the
    # hosted lane for public changes; releases repeat it before publication.
    if: github.event.repository.private == false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch main for baseline checks
        run: |
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main refs/remotes/origin/main
          fi

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
          cache: true

      - name: Run the native macOS gate
        uses: ./.github/actions/macos-gate

  wsl:
    name: WSL gate
    # Windows support is WSL-only (the Linux binary inside WSL 2), so this lane
    # provisions WSL 2 on a hosted Windows runner and runs the gate inside it.
    # Routine on public CI like macOS; workflow_dispatch keeps it runnable
    # ad hoc while the repository is private.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    # WSL provisioning can hang when the runner image misbehaves; a bound keeps
    # a stuck lane from burning six hours of 2x Windows minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch main for baseline checks
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main refs/remotes/origin/main
          fi

      - name: Run the gate inside WSL 2
        uses: ./.github/actions/wsl-gate

  standards:
    # Hold the metric standards (coverage, …). They run the whole suite under
    # coverage instrumentation, so they are deliberately NOT part of the gate.
    # Enforce them on PULL REQUESTS only: every PR must hold the floor, while
    # direct pushes to main stay fast (whatever landed already passed on its PR).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
          cache: true

      # Standards and agreement-version checks compare against the real base
      # branch. A shallow PR checkout does not carry it, so fetch it explicitly.
      - name: Fetch main for baseline checks
        run: |
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main refs/remotes/origin/main
          fi

      # The prose standard measures with Vale; install + sync it like the gate job.
      - name: Install Vale and sync its styles
        run: |
          VALE_VERSION="$(<.vale-version)"
          curl -sfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin vale
          vale sync

      - name: Hold the standards
        run: deno task dev standards
