name: cla

# Ask each external contributor to sign the contributor license agreement
# (CLA.md) on their first pull request, record the signature, and hold a
# failing status until it exists. Signatures are committed to the
# unprotected cla-signatures branch. The check matters once the repository
# is public and external pull requests exist; requiring it in branch
# protection is an owner step in the repository settings, not in this file.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The action posts the signature-request comment, commits signatures, and
# sets the pull-request status; each needs its own write scope.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/jackwh/discern/blob/main/CLA.md
          branch: cla-signatures
          allowlist: jackwh,bot*
