name: resume verified release
on:
  workflow_run:
    workflows: [gate]
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: release-resume-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  resume:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # Completion events execute trusted default-branch coordination code.
      # The dispatched release itself runs on the explicit version tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version-file: .dvmrc
          cache: true
      - name: Resume unpublished tags verified by this gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GATE_RUN: ${{ github.event.workflow_run.id }}
        run: >-
          deno run --allow-read --allow-write --allow-run=git,gh --allow-env
          scripts/release_gate.ts resume "$GATE_RUN"
