name: Fetch gate policy base
description: Fetch the actual event policy base without replacing the checked-out source branch.

inputs:
  base:
    description: Pull-request base or pre-push commit; an absent initial ref uses current main.
    required: false
    default: ""

outputs:
  sha:
    description: Resolved immutable comparison commit.
    value: ${{ steps.policy.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Fetch the immutable comparison policy
      id: policy
      shell: bash
      env:
        POLICY_BASE: ${{ inputs.base }}
      run: |
        case "$POLICY_BASE" in
          ''|0000000000000000000000000000000000000000) policy_base=refs/heads/main ;;
          *) policy_base="$POLICY_BASE" ;;
        esac
        if [[ ! "$policy_base" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ && "$policy_base" != refs/heads/main ]]; then
          echo "Policy base must be a full commit id or the initial main fallback." >&2
          exit 1
        fi
        git fetch --no-tags origin "$policy_base"
        policy_commit="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
        git update-ref refs/discern/ci-policy-base "$policy_commit"
        printf 'sha=%s\n' "$policy_commit" >> "$GITHUB_OUTPUT"
