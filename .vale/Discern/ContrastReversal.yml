# The "X, not Y" / "X, never Y" family can explain a consequential boundary.
# This is an editorial prompt, with no per-page budget. Lookup entries may
# repeat a necessary distinction for readers who arrive directly at that entry.
extends: existence
message: "Avoid '%s': state the behavior directly, unless a likely misunderstanding has a practical consequence that needs this distinction."
ignorecase: true
level: warning
nonword: true
tokens:
  - ',\s+not\s+[^.?!;:—]{1,45}[.?!:;]'
  - ',\s+never\s+[^.?!;:—]{1,45}[.?!:;]'
