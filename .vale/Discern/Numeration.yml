# Avoid counted list introductions: they duplicate an inventory that can drift.
# Keep the detector blocking; explain useful quantities without counting a set
# merely to introduce it. Changing a spelled-out count to digits is not a fix.
extends: existence
message: "Remove the counted introduction '%s'; name the items or let the list speak. Keep quantities only when the quantity itself matters; do not evade this rule with digits."
ignorecase: true
level: warning
scope: sentence
nonword: true
tokens:
  - '^(?:(?:the|these|those|all)\s+)?(?:two|three|four|five|six|seven|eight|nine|ten)\s+(?:more\s+)?[\w-]+\b'
  - '\b(?:two|three|four|five|six|seven|eight|nine|ten)\s+(?:more\s+)?[\w-]+s:'
  - '\bthere\s+are\s+(?:two|three|four|five|six|seven|eight|nine|ten)\b'
  - '\bone\s+of\s+(?:two|three|four|five|six|seven|eight|nine|ten)\b'
  - '\bfalls?\s+into\s+(?:two|three|four|five|six|seven|eight|nine|ten)\b'
