# The "not X, but Y" family can correct a plausible misunderstanding. Review
# whether the distinction changes the reader's next action; remove invented
# oppositions and contrasts that only praise the preferred choice.
extends: existence
message: "Avoid this contrast: state what happens directly, unless a likely misunderstanding affects the next action and needs an explicit distinction."
ignorecase: true
level: warning
tokens:
  - not\s+[^.?!;:—]{1,45},\s+but
  - isn(?:'|’)t\s+[^.?!;:—]{1,45}[,;]\s+it(?:'|’)s
  - wasn(?:'|’)t\s+[^.?!;:—]{1,45}[,;]\s+it\s+(?:was|is)
  - was\s+never\s+the\s+point
  - not\s+about\s+[^.?!;:—]{1,45}[,;.]\s+it(?:'|’)s\s+about
