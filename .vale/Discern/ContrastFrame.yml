# The "not X, but Y" family — the strongest machine-written fingerprint (voice
# skill: banned moves). Docs budget: one per page, and only when the
# distinction is load-bearing; marketing budget: zero.
extends: existence
message: "Contrast-frame ('not X, but Y'): state the true half plainly, unless the distinction is genuinely load-bearing."
ignorecase: true
level: warning
tokens:
  - not [^.?!;:—]{1,45},\s+but
  - isn(?:'|’)t [^.?!;:—]{1,45}[,;]\s+it(?:'|’)s
  - wasn(?:'|’)t [^.?!;:—]{1,45}[,;]\s+it (?:was|is)
  - was never the point
  - not about [^.?!;:—]{1,45}[,;.]\s+it(?:'|’)s about
