# Scene-setting clichés (voice skill: banned moves). Zero legitimate uses, so
# it blocks the gate. Words join with \s+ so an instance wrapped across source
# lines still matches.
extends: existence
message: "'%s' is a scene-setting cliché: start with the fact."
ignorecase: true
level: error
tokens:
  - it(?:'|’)s\s+20\d\d
  - in\s+a\s+world\s+where
  - we(?:'|’)ve\s+all\s+been\s+there
