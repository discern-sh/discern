# Vendor-speak a friend would never say across the table (voice skill: banned
# words). Substitution so the fix rides along with the finding. Zero legitimate
# uses, so it blocks the gate. Multi-word keys join with \s+ so an instance
# wrapped across source lines still matches.
extends: substitution
message: "Vendor-speak: use '%s' instead of '%s'."
ignorecase: true
level: error
action:
  name: replace
swap:
  leverage: use
  leverages: uses
  leveraged: used
  leveraging: using
  utilize: use
  utilizes: uses
  utilized: used
  utilizing: using
  facilitate: help
  facilitates: helps
  facilitated: helped
  facilitating: helping
  enables\s+you\s+to: lets you
  prior\s+to: before
