# Avoid stock singular and scope emphasis. Keep this detector blocking.
# Name the selected item or relevant scope directly; do not substitute another
# empty intensifier to evade the pattern.
extends: existence
message: "Remove the emphasis in '%s'; name the relevant item or scope directly. Do not replace an empty intensifier with a synonym."
ignorecase: true
level: warning
nonword: true
tokens:
  - '\bthe\s+one\s+[\w-]+'
  - '\bthe\s+whole\s+[\w-]+'
