# Singular and scope emphasis (voice skill: banned words). These forms sometimes
# carry a real distinction, so they remain warnings for the writer to judge.
extends: existence
message: "'%s' is seasoning, not information: cut it, or replace it with the fact."
ignorecase: true
level: warning
nonword: true
tokens:
  - '\bthe\s+one\s+[\w-]+'
  - '\bthe\s+whole\s+[\w-]+'
