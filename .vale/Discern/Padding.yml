# These qualifiers can change meaning. Review them in context rather than
# equating their presence with a defect. Avoid calling difficult work easy;
# an easy-to-use goal can describe the user's intended outcome.
extends: existence
message: "Review '%s': keep a qualifier that changes meaning; remove empty reassurance or claims that difficult work is easy."
ignorecase: true
level: suggestion
tokens:
  - just
  - actually
  - really
  - easy
