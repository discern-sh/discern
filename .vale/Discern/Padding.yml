# The high-frequency padding words (voice skill: banned words). Suggestion
# severity: each is occasionally load-bearing ("just" as "only"), so this rule
# prompts a look rather than asserting a defect.
extends: existence
message: "'%s' is usually padding: delete it unless it changes the meaning."
ignorecase: true
level: suggestion
tokens:
  - just
  - actually
  - really
  - easy
