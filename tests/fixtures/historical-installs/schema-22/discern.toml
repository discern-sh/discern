[meta]
schema_version = 22
bootstrapped = true

[project]
slug = "historical-schema-22"

[map]
dir = "map/"

[jobs]
format = "discern tidy"
test = "deno test"

[scopes.docs]
paths = ["${map.dir}", "discern/", ".claude/", ".agents/"]
neutral = true

[worktree]
port = true

[standards.coverage]
direction = "up"
limit = 80
run = "measure-coverage"

[coupling]
in_gate = false
