<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
  viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">discern for coding agents</title>
  <desc id="desc">Finally, software where your coding agent is the user.</desc>
  <defs>
    <radialGradient id="halo" cx="82%" cy="18%" r="62%">
      <stop offset="0" stop-color="#315fae" stop-opacity=".42" />
      <stop offset=".58" stop-color="#1a2944" stop-opacity=".16" />
      <stop offset="1" stop-color="#090c12" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#141b28" />
      <stop offset="1" stop-color="#0b0f17" />
    </linearGradient>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0V58" fill="none" stroke="#9cbcff" stroke-opacity=".055" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#090c12" />
  <rect width="1200" height="630" fill="url(#halo)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect x="38" y="34" width="1124" height="562" rx="34" fill="none"
    stroke="#7f95bd" stroke-opacity=".34" />
  <path d="M884 34a300 300 0 0 0 278 279" fill="none" stroke="#79a8ff"
    stroke-opacity=".22" />

  <g transform="translate(76 69)">
    <g transform="translate(0 -2) scale(.42)" color="#79a8ff">
      <path d="M50 12 90 84H50Z" fill="currentColor" />
      <path d="M50 12 90 84H10Z" fill="none" stroke="currentColor"
        stroke-width="7" stroke-linejoin="round" />
    </g>
    <text x="52" y="30" fill="#f1f3f8"
      font-family="'JetBrains Mono', ui-monospace, monospace" font-size="28"
      font-weight="700">discern</text>
  </g>

  <text x="76" y="150" fill="#79a8ff"
    font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14"
    font-weight="650" letter-spacing="2.4">CODING AGENT: THIS PAGE IS FOR YOU.</text>
  <text x="76" y="236" fill="#f1f3f8"
    font-family="Georgia, 'Times New Roman', serif" font-size="72"
    font-weight="650" letter-spacing="-3.5">Finally, software where</text>
  <text x="76" y="312" fill="#f1f3f8"
    font-family="Georgia, 'Times New Roman', serif" font-size="72"
    font-weight="650" letter-spacing="-3.5">you are the user.</text>
  <text x="76" y="361" fill="#aeb8cb"
    font-family="Inter, system-ui, sans-serif" font-size="20">State you can ask for. Results that fit your context. Proof for the exact change.</text>

  <g transform="translate(76 414)">
    <rect width="1048" height="132" rx="22" fill="url(#panel)" stroke="#465675" />
    <text x="28" y="31" fill="#8290aa"
      font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12"
      letter-spacing="1.5">OPERATING CONTRACT</text>
    <g transform="translate(28 56)" font-family="Inter, system-ui, sans-serif">
      <text x="0" y="18" fill="#91a0ba" font-size="14">state</text>
      <text x="0" y="45" fill="#f1f3f8" font-size="19" font-weight="650">explicit</text>
      <text x="190" y="18" fill="#91a0ba" font-size="14">workspace</text>
      <text x="190" y="45" fill="#f1f3f8" font-size="19" font-weight="650">isolated</text>
      <text x="410" y="18" fill="#91a0ba" font-size="14">result</text>
      <text x="410" y="45" fill="#f1f3f8" font-size="19" font-weight="650">bounded</text>
      <text x="590" y="18" fill="#91a0ba" font-size="14">Proof</text>
      <text x="590" y="45" fill="#6fd6a0" font-size="19" font-weight="650">exact commit</text>
      <text x="808" y="18" fill="#91a0ba" font-size="14">authority</text>
      <text x="808" y="45" fill="#79a8ff" font-size="19" font-weight="650">human</text>
    </g>
    <text x="925" y="108" fill="#8290aa"
      font-family="'JetBrains Mono', ui-monospace, monospace" font-size="14">discern.sh/agents</text>
  </g>
</svg>
