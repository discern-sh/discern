<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
  viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">discern</title>
  <desc id="desc">A bolder way to build.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="10%" r="72%">
      <stop offset="0" stop-color="#315fae" stop-opacity=".46" />
      <stop offset=".52" stop-color="#202a43" stop-opacity=".2" />
      <stop offset="1" stop-color="#151821" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#252b3b" />
      <stop offset="1" stop-color="#1b1e29" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#a9b5d0" stroke-opacity=".045" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#151821" />
  <rect width="1200" height="630" fill="url(#halo)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <g transform="translate(76 58)">
    <g transform="translate(0 -3) scale(.4)" color="#79a8ff">
      <path d="M50 12 90 84H50Z" fill="currentColor" />
      <path d="M50 12 90 84H10Z" fill="none" stroke="currentColor"
        stroke-width="7" stroke-linejoin="round" />
    </g>
    <text x="48" y="28" fill="#f1f3fa"
      font-family="'JetBrains Mono', ui-monospace, monospace" font-size="28"
      font-weight="700">discern</text>
  </g>

  <g transform="translate(704 48)">
    <rect width="420" height="42" rx="21" fill="#252b3b" stroke="#4a5876" />
    <circle cx="22" cy="21" r="4" fill="#79a8ff" />
    <text x="38" y="27" fill="#c5ccda"
      font-family="Inter, system-ui, sans-serif" font-size="13"
      font-weight="650" letter-spacing="1"
      style="text-transform: uppercase">quality harness for agent-built software</text>
  </g>

  <text x="76" y="242" fill="#f5f3f7"
    font-family="'Crimson Pro', Georgia, serif" font-size="110"
    font-weight="650" letter-spacing="-4">A bolder way</text>
  <text x="76" y="346" fill="#79a8ff"
    font-family="'Crimson Pro', Georgia, serif" font-size="110"
    font-weight="650" font-style="italic" letter-spacing="-4">to build.</text>

  <g transform="translate(76 420)">
    <rect width="1048" height="142" rx="24" fill="url(#panel)"
