    <text x="28" y="35" fill="#8290aa"
      font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13"
      letter-spacing="1.4">PROJECT IN MOTION</text>
    <text x="28" y="73" fill="#f0f2f7"
      font-family="'Crimson Pro', Georgia, serif" font-size="30"
      font-weight="650">One ambition, returned ready for a decision</text>
    <g transform="translate(28 96)" fill="#aeb7ca"
      font-family="Inter, system-ui, sans-serif" font-size="14">
      <text x="0" y="16">Brief</text>
      <text x="64" y="16" fill="#7183a7">→</text>
      <text x="92" y="16">Work</text>
      <text x="150" y="16" fill="#7183a7">→</text>
      <text x="178" y="16">Evidence</text>
      <text x="264" y="16" fill="#7183a7">→</text>
      <text x="292" y="16" fill="#79a8ff" font-weight="700">Decision</text>
    </g>
    <g transform="translate(828 29)">
      <rect width="190" height="40" rx="20" fill="#18382c" stroke="#367a5c" />
      <circle cx="22" cy="20" r="4" fill="#70d99f" />
      <text x="38" y="25" fill="#a9ecc4"
