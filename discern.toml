# discern.toml — the one file that teaches a stack-neutral harness about YOUR
# project. The engine is generic and lives inside the `discern` binary; everything
# specific to your language and tools lives here. This file is yours: edit it by
# hand. `discern upgrade` runs config-schema migrations, re-materializes the bundled
# skills, recompiles the agent guidance, and stamps [meta].schema_version — it never
# rewrites your settings below. (Getting a newer binary is a separate axis:
# install.sh / brew upgrade / a future `discern self-update`.)
#
# Generated by discern 1.0.0 for "discern".

[project]
# Short, lowercase, dash-separated identity. Used for worktree/site/branch names.
slug = "discern"

# Branch prefix for worktrees created by the harness, e.g. "agent/my-feature".
branch_prefix = "agent/"

# The integration branch the gate merges into and worktrees graduate onto.
# Override per-invocation with the MAIN_BRANCH env var.
main_branch = "main"

# Where the gate points an agent when a stage fails in a non-obvious way. Keep
# this doc current with the traps specific to your stack (see the comment block
# the gate prints on failure). Empty disables the pointer.
gotchas_doc = "docs/80-development/finish-gate-gotchas.md"

# [meta] — installer bookkeeping. `schema_version` is the migration anchor
# (ADR 0014): `discern upgrade` reads it, runs any pending migrations, and
# re-stamps it. Edit by hand only to force a re-migration.
[meta]
bootstrapped = true
schema_version = 8

# ─────────────────────────────────────────────────────────────────────────────
# [capabilities] — the core commands the gate runs, one per known capability.
# Each maps to a gate stage automatically: format->fix, build->build,
# lint/typecheck->check, test->test. A value is one command, or a list run in
# order. An omitted capability is knowably absent (build is release-only here, so
# it is not wired into the gate). `discern doctor` shows which are wired.
# ─────────────────────────────────────────────────────────────────────────────

[capabilities]
format    = "deno fmt"
lint      = "deno lint"
typecheck = "deno check src/main.ts"
test      = "deno task test"

# ─────────────────────────────────────────────────────────────────────────────
# [checks.<name>] — custom gate work outside the known capability vocabulary.
# `stage` (required) is one of fix|build|check|test. None are wired here: the
# selfcheck/shellcheck checks retired with the committed shell engine (the engine
# now lives in the binary, so there is no installed copy to keep in sync).
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# [scopes.<name>] — named regions of the repo. `paths` globs define a scope; the
# optional flags (neutral / previewable / gate) tune the gate for changes there.
# Classification fails OPEN: a path matching no scope counts as gated code.
# ─────────────────────────────────────────────────────────────────────────────

# Docs and agent-guidance sources need no gate (generated guidance is refreshed by
# the gate itself; editing the source changes no behaviour). Root-level *.md too.
[scopes.docs]
paths   = ["docs/", ".claude/", "skills/"]
neutral = true

# ─────────────────────────────────────────────────────────────────────────────
# [worktree] — the isolated-worktree workflow. The git mechanics are generic;
# the two seams (database, dev-server) are empty by default, so a worktree round
# is a clean no-op until you wire them to your stack.
# ─────────────────────────────────────────────────────────────────────────────

[worktree]
enabled = true

# Environment values copied from the main checkout's .env into a new worktree's
# .env (secrets a fresh worktree needs but that aren't in version control).
inherit_env = []   # e.g. ["APP_KEY", "OPENAI_API_KEY"]

# Give each worktree a deterministic dev-server port (hashed from its id) so
# concurrent worktrees never collide. Read it with `discern worktree-name --port`.
port = true

# A per-worktree database, so tests never clash. Uses @db@ (db-name-safe).
# [worktree.resources.db]
# create  = "createdb -T @project_slug@_template @db@"
# destroy = "dropdb --if-exists @db@"

# A per-worktree dev-server site (a Docker vhost, an ngrok tunnel, a reverse-proxy
# entry, …). Uses @site@ (DNS-safe). Declared after db so it is torn down first.
# [worktree.resources.dev_server]
# create  = "link-site @site@ @port@"
# destroy = "unlink-site @site@"

# Any other isolated resource — an emulator, a queue, a bucket, a namespace.
# [worktree.resources.example]
# create   = "make-thing @resource@"
# destroy  = "destroy-thing @resource@"   # idempotent: may re-run via worktree:prune
# ensure   = "ensure-thing @resource@"   # optional: reconcile drift at session start
# required = true                          # optional: false = create failure is non-fatal
# retries  = 0                             # optional: retry create/destroy N times
# gc       = true                          # optional: false = never orphan-prune it
#                                          #   (teardown-only; for data-loss-sensitive ones)

# Post-create setup: commands run once after a worktree is created (install
# deps, run migrations, warm caches). Run in order.
[worktree.setup]
steps = []   # e.g. ["npm ci", "npm run build"]

# ─────────────────────────────────────────────────────────────────────────────
# [ratchets] — never-loosen quality floors, enforced on demand by `discern ratchets`
# (slow, so NOT part of `discern finish`). Each [ratchets.<name>]'s `run` emits a
# line `DISCERN_METRIC <metric> <number>` (last wins); the floor/ceiling is
# compared vs main, so it can only tighten on a branch.
# ─────────────────────────────────────────────────────────────────────────────

# Coverage ratchet — hold src/ line coverage at or above a rising floor. The run
# executes the suite under Deno coverage and emits DISCERN_METRIC coverage <pct>
# for src/ (the installer AND the TS engine — both instrumented now). Held by
# `discern ratchets`, enforced on every PR in CI. NOTE: the floor was re-baselined
# downward at the single-binary cutover (ADR 0019) — the engine moved into src/ and
# became instrumented, so the same suite now covers a larger tree. Ratchet it back
# up as coverage improves (see TODO.md).
[ratchets.coverage]
direction = "up"
limit     = 85
run       = "deno task coverage"

# ─────────────────────────────────────────────────────────────────────────────
# [gate] — ergonomics for the parallel gate stages (and scope gates). These
# affect how `discern finish` runs its concurrent jobs.
# ─────────────────────────────────────────────────────────────────────────────

[gate]
# Stream each job's output live (line-prefixed `── <label> │ …`) instead of
# buffering it until the stage finishes. Helps when watching a slow build/test.
# Concurrent jobs interleave (but stay labelled). Off by default (grouped).
stream = false

# Cancel the in-flight sibling commands the moment one fails, instead of running
# every command to completion. ON by default — an agent-driven gate wants a fast
# abort. Set false to run every job and see all failures in one pass. The engine
# tree-kills a cancelled job's whole process group (Deno `detached` + `Deno.kill`),
# so its grandchildren don't linger.
fail_fast = true

# ─────────────────────────────────────────────────────────────────────────────
# [recipes] — your OWN `discern` commands. Drop an executable script carrying a
# `# desc: ...` line into the directory below and it becomes a first-class
# `discern <name>` command, listed by `discern --help` under "Project recipes".
# This directory is yours: `discern upgrade` never writes or refreshes anything
# here. A name that collides with a built-in engine verb (finish, worktree:*, …) is
# ignored with a warning — the engine always wins, so a project file can never
# redefine the core gate. A recipe is a standalone executable (any language), exec'd
# with the DISCERN_* env exported; read config via `discern config get` and worktree
# identity via `discern worktree-name` — there is no shell library to source.
# ─────────────────────────────────────────────────────────────────────────────

[recipes]
# Where your recipes live, relative to the project root. The default works with
# no config at all; point it elsewhere (e.g. "tools/") if you prefer.
dir = "recipes"

[features]
docs = true
skills = true
guidance = true
ratchets = true
worktrees = true

[guidance]
agents = ["claude_code", "codex"]
sources = ["guidance.md"]

[skills]
dir = "skills"
