# A scope may name the read-only command that previews its changes.
# [scopes.assets]
  # paths       = ["assets/**", "public/**"]
  # preview = "deno task preview"

# The public site (discern.sh): static editions plus the fetch handler that
# serves them. Run it locally with `deno task site`. The scope gate projects
# every registry-owned marketing route into its declared register and blocks
# Vale errors before the page can ship. Advisories stay under the density
# Standard so signed-off copy cannot accumulate new lint debt.
[scopes.site]
  paths = ["site/**"]
  preview = "deno task site"
  gate = "deno task site:prose-check -- --sarif"
  timeout = 120

# A sub-component with its own self-contained gate:
# [scopes.native]
  # paths = ["native/**"]
  # gate  = "make -C native check"

# ─────────────────────────────────────────────────────────────────────────────
# [generated.<name>]
#
# What:    Committed artifacts that one generator owns.
# Why:     `discern prepare` and `discern done` rerun each generator and fail
#          when the committed bytes differ, so a generated file cannot drift
#          from its source and nobody edits it by hand.
#
# Params:  paths, run, linguist_generated, timeout
# Help:    `discern config explain generated`
# ─────────────────────────────────────────────────────────────────────────────

# The registry-codegen family: every whole-file artifact `deno task codegen`
# derives from the canonical registries. The list mirrors the meta-registry's
# enrolled write targets (`codegenWriteTargets()` in scripts/canonical_sets.ts);
# tests/canonical_sets_enrolment_test.ts holds the two equal, so a new codegen
# target must be declared here in the same change. The three maintained-block
# pages codegen also edits (artifact-ownership.md, mcp-and-results.md,
# install-surface.md) are deliberately undeclared: they are part-authored, so
# a merge conflict there still needs judgment, not regeneration.
[generated.codegen]
  paths = [
    "templates/discern.toml.tmpl",
    "schema/discern-config.schema.json",
    "schema/discern-setup-config.schema.json",
    "schema/discern-results.schema.json",
    "schema/discern-proof-note.schema.json",
    "schema/discern-mcp-tools.json",
    "schema/discern-cli.json",
    "schema/discern-conventions.json",
    "types/discern-json.d.ts",
    "${map.dir}00-orientation/glossary.md",
    "${map.dir}00-orientation/the-practice.md",
    "project/manual/30-reference/glossary.md",
    "project/manual/30-reference/cli-reference.md",
    "project/manual/30-reference/config-reference.md",
    "project/manual/30-reference/environment-variables.md",
    "${map.dir}_internal/feature-canon.md",
    "${map.dir}_internal/feature-canon-plain.md",
    "${map.dir}_internal/feature-canon-human-benefits.md",
    "${map.dir}_internal/feature-canon-agent-benefits.md",
    "${map.dir}_internal/hint-inventory.md",
    "${map.dir}_internal/practice-canon.md",
    "${map.dir}_internal/registry-atlas.md",
    "${map.dir}_internal/tip-inventory.md",
    "${map.dir}_internal/voice-enforcement-coverage.md",
    "${map.dir}_internal/brand/README.md",
    "${map.dir}_internal/brand/boundary-canon.md",
    "${map.dir}_internal/brand/claims-and-evidence.md",
    "${map.dir}_internal/brand/consequence-canon.md",
    "${map.dir}_internal/brand/readiness-canon.md",
    "${map.dir}_internal/brand/copy-patterns.md",
    "${map.dir}_internal/brand/demand-canon.md",
    "${map.dir}_internal/brand/messaging.md",
    "${map.dir}_internal/brand/positioning.md",
    "${map.dir}_internal/brand/register-bridge.md",
    "${map.dir}_internal/brand/visual-identity.md",
    "${map.dir}_internal/agent-integration-coverage.md",
    "${map.dir}_internal/cross-agent-behaviour-reference.md",
    "${skills.dir}/discern-brand-voice/SKILL.md",
    "${skills.dir}/discern-product-voice/SKILL.md",
    "${skills.dir}/discern-agent-voice/SKILL.md",
    ".vale/DiscernBrand/ProductName.yml",
    ".vale/DiscernBrand/GenericVerbs.yml",
    ".vale/DiscernBrand/GenericAdjectives.yml",
    ".vale/DiscernBrand/TemplateOpener.yml",
    ".vale/DiscernBrand/CtaGenericLabel.yml",
    ".vale/DiscernBrand/RepeatedContrast.yml",
    ".vale/DiscernBrand/StackedSlogans.yml",
    ".vale/DiscernProduct/ProductName.yml",
    ".vale/DiscernProduct/CanonicalTermCase.yml",
    ".vale/DiscernProduct/AgentBlame.yml",
    ".vale/DiscernAgent/BestJudgment.yml",
    ".vale/DiscernAgent/PositionalReference.yml",
    "site/pages/assets/search.js",
    "site/pages/assets/integrations/README.md",
    "templates/skills/discern-write-adr/skeleton/map/_adr/0000-template.md",
    "templates/skills/discern-write-adr/skeleton/map/_adr/0001-adopt-discern.md",
    "templates/skills/discern-write-adr/skeleton/map/_adr/README.md",
    ".github/cla-assistant/metadata",
