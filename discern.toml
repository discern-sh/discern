#:schema https://discern.sh/schema/v1/discern-config.schema.json
# Generated automatically by discern via the bundled project configuration template | https://discern.sh
#
# discern is a stack-neutral system for coding agents and their humans.
# Use discern.toml to teach discern about your project, preferences, and tooling.
#
# The quickest way to get started is to tell your coding agent:
#   "Run `discern setup` and follow the instructions.".
#
# Help is always available through the command line or MCP server:
#   - Read the documentation:   `discern docs`   | MCP: `discern_docs`
#   - Verify your installation: `discern doctor` | MCP: `discern_doctor`
#   - Show the current status:  `discern status` | MCP: `discern_status`
#   - Check for updates:        `discern upgrade --check`
#
# Generated by discern 1.0.0 for "discern".

[project]
  # discern intentionally self-hosts every configurable authored source under
  # project/ to exercise path overrides; fresh installations keep shipped defaults.

  # Display name (free text), used when compiled instructions address the project.
  # Empty falls back to the slug.
  name = "discern"

  # Short, lowercase, dash-separated identity. Used for worktree/site/branch names.
  slug = "discern"

  # Where the gate points an agent when a stage fails in a non-obvious way. Keep
  # this doc current with the traps specific to your stack (see the comment block
  # the gate prints on failure). Empty disables the pointer.
  gotchas_doc = "project/map/80-development/done-gate-gotchas.md"

  # Where the deferred-work ledger lives.
  todo = "project/TODO.md"

  # discern keeps a logbook: one line of local operational history per verb run,
  # stored under .git and shared by this repository's worktrees. Metadata only:
  # timings, outcomes, and names, never code or command output, so any line is
  # safe to read aloud. It is never committed and never transmitted. Delete it
  # any time with `discern patterns reset`.
  # Recommended on. History can't be recorded after the fact, and while
  # recording is off this project goes without:
  #   - the practice report (`discern patterns`) — frozen at existing history
  #   - each worktree's last action and work in flight
  #   - fleet activity times that include verb runs
  #   - wait bounds in `discern await` from active work and observed P90 durations
  #   - configuration-change attribution and each Standard's limit history
  #   - advisory findings on `status`, the `done` Proof, and `improvement`
  #   - wait estimates when concurrent test runs queue
  #   - the in-flight check on the contained-worktree offer
  #   - observed checkpoint economics (`discern checkpoints`)
  #   - recorder continuity checks in `discern doctor`
  # Set false to stop all writes; existing history stays until you delete it.
  logbook = true

  # Which agent integrations to enable. Agent file targets:
  #   "claude_code" -> CLAUDE.md   "codex" -> AGENTS.md   "gemini" -> GEMINI.md
  #   "cursor" -> AGENTS.md        "copilot" -> AGENTS.md
  agents = ["claude_code", "codex", "gemini", "cursor", "copilot"]

# ─────────────────────────────────────────────────────────────────────────────
# [repository] — policy shared by every checkout of this Git repository: where
# work lands, how discern names worktree branches, and how any checkout converges
# its local runtime state after its tracked tree changes.
# ─────────────────────────────────────────────────────────────────────────────

[repository]
  # The shared branch the gate merges into and completed work lands on. Detected
  # at setup (origin/HEAD, then the branch setup started from, then
  # init.defaultBranch). Override per-invocation with DISCERN_TRUNK.
  trunk = "main"

  # Branch prefix for worktrees created by discern, e.g. "agent/my-feature".
  branch_prefix = "agent/"

  # This repository carries landed proof notes through ordinary fetches. A remote
  # does not need to have published its first proof note. Publishing remains an
  # explicit `git push <remote> refs/notes/discern`.
  proof_notes = "fetch"

  # Idempotent commands that make ANY checkout usable for its current tracked tree
  # — typically dependency installation from a lockfile. They run in order on each
  # managed worktree pass and after `discern accept` updates the trunk checkout.
  # Post-landing failures are recorded, but later commands still run, as acceptance
  # is a one-way process. Keep worktree-identity-dependent commands under
  # [worktree.setup].ensure instead; those never run in the main checkout.
  ensure = [
    "deno install --frozen",
    "deno task site:build",
    "deno task vale:sync",
  ]

# ─────────────────────────────────────────────────────────────────────────────
# [map] — the project map: discern's agent-maintained documentation tree. This is
# distinct from human-curated project docs: setup scaffolds it here, `discern map`
# browses it. Live `${<config-key>}` references keep checks, scopes, generated
# paths, and standards tied to configured entries in the source-path registry.
# ─────────────────────────────────────────────────────────────────────────────

[map]
  # The directory that holds this project's map.
  dir = "project/map/"

# ─────────────────────────────────────────────────────────────────────────────
# [instructions] — the author-once → compile-everywhere agent-instruction pipeline.
# `discern refresh` compiles discern's built-in instructions (always
# prepended) plus YOUR sources below into one generated file per
# provider. The generated files are committed so every agent — cloud
# included — reads them, but never hand-edited: edit your sources below and
# re-run `discern refresh`; `discern status` / `discern done` flag a generated
# file that has drifted from its source.
# ─────────────────────────────────────────────────────────────────────────────

[instructions]
  # Your instruction source file(s), relative to the project root. Globs are allowed.
  # Read only if present; discern's built-in instructions are always prepended.
  sources = ["project/instructions.md"]

# ─────────────────────────────────────────────────────────────────────────────
# [skills] — focused, reusable task playbooks. The effective set is discern's
# bundled built-ins plus YOUR authored skills under the directory below, where
# yours override a built-in of the same name. discern materializes the set into
# each agent's skills dir (gitignored): built-ins copied, yours symlinked (edits live).
#   discern skills list           show the set + which of yours override which
#   discern skills eject <name>   copy a built-in here so you can customize it
# ─────────────────────────────────────────────────────────────────────────────

[skills]
  # Where your authored skills live, relative to the project root.
  dir = "project/skills"

# ─────────────────────────────────────────────────────────────────────────────
# [jobs] — every command the gate runs, in one namespace. Known names derive
# their gate stage automatically:
#   format     fix    a formatter/codemod (mutating; runs first, serially)
#   build      build  produce artifacts later stages read (compile, bundle)
#   lint       check  read-only static analysis
#   typecheck  check  read-only type checking
#   test       test   the test suite
#   smoke      test   a fast, side-effect-light readiness check: the app boots
#                     and its essential shared runtime needs work in this checkout
# A value is one command, or a list run in order: lint = ["eslint .", "stylelint ."].
# A job needing its own time budget takes the table form — the `timeout` (seconds)
# replaces the global [gate].timeout for that job only, 0 disables its bound:
#   test = { run = "npm test", timeout = 1200 }
# OMIT an individual known job you truly do not have yet. A config with no known
# jobs wired is only a bootstrap state: the gate can pass without its built-in
# protections, so `discern doctor` reports it as a warning. `discern setup` has
# your coding agent fill these by sniffing the repo; `discern doctor` shows which
# known names and custom jobs are wired.
#
# `discern prepare` is the fast inner loop: it runs the fix-stage jobs, regenerates
# every `[generated]` group, then runs the check-stage jobs — never build jobs or tests.
#
# `smoke` is the project's fast readiness check — real config and essential shared
# runtime dependencies that Discern cannot infer. Keep it much faster than `test`:
# `discern done` and `discern test` run it in the same fail-fast test group, so a
# quick smoke failure cancels slower siblings.
# Custom names use `[jobs.<name>]` and MUST declare `stage` (fix|build|check|test)
# plus `run` (a command or list). `provides` is an optional free-text label;
# `timeout` has the same per-job meaning as above. Known names MUST NOT declare
# `stage`: their stage comes from the list above.
# Commands, scope paths and gates, generated paths and runs, and Standard
# `run`/`inputs`/`per` globs accept `${<config-key>}` references for every
# configured source in the paths registry. Unregistered braced forms stay
# untouched, so ordinary shell expansion keeps working.
# ─────────────────────────────────────────────────────────────────────────────

[jobs]
  format = ["deno fmt", "discern tidy"]
  # `deno task codegen` runs as the [generated.codegen] group below — one
  # command, one home; the build job keeps only the uncommitted site output.
  build = "deno task site:build"
  lint = "deno lint"
  typecheck = "deno check"
  # Local gates default to JUnit for per-test Tier-1 diagnostics (file, line,
  # test name) and attributable logbook classes. Hosted full gates select the
  # pretty reporter for readable logs; bare `deno task test` does the same.
  # The budget fits the slowest hosted lane: the WSL 2 gate runs the suite
  # 5-6x slower than a dev machine and needs ~1300s on a 2-core runner, so
  # 2400 leaves headroom there while still bounding a genuine hang.
  test = { run = "deno task test --reporter=${DISCERN_GATE_TEST_REPORTER:-junit}", timeout = 2400 }
  smoke = "deno task dev --version"

  # `prose` lints the map with Vale at the check stage. Error-severity findings
  # block map-wide; every discern-authored voice alert blocks throughout the
  # staged non-private Map. Other advisories are held by the [standards.prose]
  # ceiling. The wrapper stages one frontmatter-blanked mirror first
  # (scripts/prose_lib.ts): Vale measures prose, never metadata.
  # `--sarif` makes each finding a file/line/rule diagnostic in the gate's
  # failure recap; drop it (or use `discern scripts prose-page`) for Vale's
  # human line format.
  [jobs.prose]
    stage = "check"
    run = "deno run --allow-read --allow-write --allow-env --allow-run scripts/prose_check.ts --sarif --custom-zero \"${map.dir}\""
    provides = "docs prose lint (Vale; errors and discern voice alerts block across the non-private Map)"

  # `canary` runs the hot, cheap test subset (scripts/canary_registry.ts: the
  # guard/enrolment convention plus registered extras) at the check stage, so
  # `discern prepare` reports a tripped guard in seconds and a red canary ends
  # the Gate's concurrent check/test group early instead of waiting out the
  # full suite. Every member runs again in the test stage: the canary changes
  # when a failure is reported, never what a green gate proves. Deliberately
  # not behind `discern queue` — the queue paces whole-suite runs, and a
  # seconds-scale subset must not wait behind one. Audit membership against
  # recorded failure evidence with `discern scripts canary-audit`. The budget
  # scales the local seconds to the slowest hosted lane, like `test` above.
  [jobs.canary]
    stage = "check"
    run = "deno run --allow-read --allow-env --allow-run scripts/canary_tests.ts"
    provides = "canary tests (hot, cheap subset heard before the full suite)"
    timeout = 300

  [jobs.project-control]
    stage = "check"
    run = "project/scripts/project-control"
    provides = "repository planning, TODO, and documenter control-document integrity"

# Setup assurance counts every known job as applicable unless its lifecycle is
# explicitly absent here. This declaration never changes Gate scheduling.
# Author changes with `discern config set-job <known-name> --not-applicable`
# or `--applicable`; a configured known job cannot also appear in this list.
[assurance]
  not_applicable = []

  # ─────────────────────────────────────────────────────────────────────────────
  # [scopes.<name>] — named regions of the repo. `paths` globs define a scope; the
  # optional flags tune the gate for changes there. Classification fails OPEN: a
  # path matching no scope counts as a real code change, so an unknown path runs
  # MORE gates, never fewer. Globs use ** for "any depth" — a directory prefix
  # ("src/**"), a standard glob ("src/**/*.ext", "src/*"), a "*.ext" suffix at
  # any depth, a "/seg/" segment, or an exact path.
  #   neutral     = true   changes here need no gate (docs, agent instructions)
  #   previewable = true   a person could see changes here — worth a preview link
  #   gate        = "..."  a command `discern done` runs when this scope changed
  #                        (a sub-component with its own self-contained gate)
  #   timeout     = N      seconds; replaces the global [gate].timeout for this
  #                        scope's gate job only (0 disables its bound)
  # ─────────────────────────────────────────────────────────────────────────────

  # Pure documentation: the map and the deferred-work ledger. Needs no gate, and
  # [acceptance] pre-authorizes it — green changes here land without a
  # conversation. Root-level *.md is always treated as neutral.
  [scopes.map]
    paths = [
      "${map.dir}",
      "${project.todo}",
    ]
    neutral = true

  # Agent-instruction surfaces: authored instructions and skills, plus the exact
  # materialized-skills directories compiled from them. Gate-neutral like the map scope,
  # but deliberately outside [acceptance] — instructions steer every future
  # session, so landing them always gets owner review. Project Scripts and
  # provider-owned sibling files still run the gate.
  [scopes.instructions]
    paths = [
      "project/instructions.md",
      "${skills.dir}/",
      ".claude/skills/",
      ".agents/skills/",
    ]
    neutral = true

  # The Big Picture: everything meaningful an external reader would want to know
  # in order to get themselves up-to-speed with discern. These paths are kept
  # inside the Map and are used by the maintainer with `discern map --export`.
  [scopes.big-picture]
    paths = [
      "${map.dir}_internal/brand/positioning.md",
      "${map.dir}_private/brand/audiences.md",
      "${map.dir}_internal/brand/demand-canon.md",
      "${map.dir}00-orientation/concepts.md",
      "${map.dir}00-orientation/glossary.md",
      "${map.dir}_internal/feature-canon.md",
      "${map.dir}70-reference/config-reference.md",
      "${map.dir}70-reference/cli-reference.md",
      "${map.dir}_internal/hint-inventory.md",
      "${map.dir}_internal/tip-inventory.md",
      "${map.dir}00-orientation/trust-and-data.md",
      "${map.dir}_internal/brand/boundary-canon.md",
      "${map.dir}_internal/brand/claims-and-evidence.md",
      "${map.dir}_internal/brand/register-bridge.md",
      "${map.dir}_internal/brand/visual-identity.md",
      "${map.dir}_internal/brand/messaging.md",
      "${map.dir}_internal/feature-canon-human-benefits.md",
      "${map.dir}_internal/feature-canon-agent-benefits.md",
      "${map.dir}_internal/practice-canon.md",
    ]
    neutral = true

  # The Little Picture: everything discern does, and everything it doesn't, nothing
  # more and nothing less. Used by the maintainer with `discern map --export`.
  [scopes.little-picture]
    paths = [
      "${map.dir}00-orientation/concepts.md",
      "${map.dir}_internal/brand/boundary-canon.md",
      "${map.dir}_internal/feature-canon.md",
      "${map.dir}_internal/feature-canon-human-benefits.md",
      "${map.dir}_internal/feature-canon-agent-benefits.md",
    ]
    neutral = true

  # The Commercial Picture: a compact, strategy-first reading list for an
  # external reader who needs the audience, demand, value, evidence, boundaries,
  # and brand expression without the full product-reference inventories.
  [scopes.commercial-picture]
    paths = [
      "${map.dir}_internal/brand/positioning.md",
      "${map.dir}_private/brand/audiences.md",
      "${map.dir}_internal/brand/demand-canon.md",
      "${map.dir}00-orientation/concepts.md",
      "${map.dir}_internal/feature-canon-human-benefits.md",
      "${map.dir}_internal/practice-canon.md",
      "${map.dir}00-orientation/trust-and-data.md",
      "${map.dir}_internal/feature-canon.md",
      "${map.dir}_internal/feature-canon-agent-benefits.md",
      "${map.dir}_internal/brand/boundary-canon.md",
      "${map.dir}_internal/brand/claims-and-evidence.md",
      "${map.dir}_internal/brand/register-bridge.md",
      "${map.dir}_internal/brand/visual-identity.md",
      "${map.dir}_internal/brand/messaging.md",
    ]
    neutral = true

  # The subset of changes a person could see — worth a preview link.
  # [scopes.assets]
  # paths       = ["assets/**", "public/**"]
  # previewable = true

  # The public site (discern.sh): static editions plus the fetch handler that
  # serves them. Run it locally with `deno task site`. The scope gate projects
  # every registry-owned marketing route into its declared register and blocks
  # Vale errors before the page can ship. Advisories stay under the density
  # Standard so signed-off copy cannot accumulate new lint debt.
  [scopes.site]
    paths = ["site/**"]
    previewable = true
    gate = "deno task site:prose-check -- --sarif"
    timeout = 120

  # A sub-component with its own self-contained gate:
  # [scopes.native]
  # paths = ["native/**"]
  # gate  = "make -C native check"

  # ─────────────────────────────────────────────────────────────────────────────
  # [generated.<name>] — committed artifacts wholly owned by one generator.
  #   paths    scope-style globs naming every artifact the generator owns
  #   run      the command, or commands in order, that rewrite those artifacts;
  #            the same tree must produce the same bytes, and the generator removes
  #            artifacts absent from its current output
  #   linguist_generated
  #            optional; true marks only this group's paths as generated for GitHub,
  #            hiding them in diffs by default and excluding them from language stats
  #   timeout  optional seconds for the command; replaces [gate].timeout for this
  #            group only (0 disables the bound)
  # ─────────────────────────────────────────────────────────────────────────────

  # The registry-codegen family: every whole-file artifact `deno task codegen`
  # derives from the canonical registries. The list mirrors the meta-registry's
  # enrolled write targets (`codegenWriteTargets()` in scripts/canonical_sets.ts);
  # tests/canonical_sets_enrolment_test.ts holds the two equal, so a new codegen
  # target must be declared here in the same change. The three maintained-block
  # pages codegen also edits (artifact-ownership.md, mcp-and-results.md,
  # install-surface.md) are deliberately undeclared: they are part-authored, so
  # a merge conflict there still needs judgment, not regeneration.
  [generated.codegen]
    paths = [
      "schema/discern-config.schema.json",
      "schema/discern-setup-config.schema.json",
      "schema/discern-results.schema.json",
      "schema/discern-proof-note.schema.json",
      "types/discern-json.d.ts",
      "${map.dir}00-orientation/glossary.md",
      "${map.dir}00-orientation/the-practice.md",
      "${map.dir}70-reference/cli-reference.md",
      "${map.dir}70-reference/config-reference.md",
      "${map.dir}70-reference/environment-variables.md",
      "${map.dir}_internal/feature-canon.md",
      "${map.dir}_internal/feature-canon-plain.md",
      "${map.dir}_internal/feature-canon-human-benefits.md",
      "${map.dir}_internal/feature-canon-agent-benefits.md",
      "${map.dir}_internal/hint-inventory.md",
      "${map.dir}_internal/practice-canon.md",
      "${map.dir}_internal/registry-atlas.md",
      "${map.dir}_internal/tip-inventory.md",
      "${map.dir}_internal/voice-enforcement-coverage.md",
      "${map.dir}_internal/brand/README.md",
      "${map.dir}_internal/brand/boundary-canon.md",
      "${map.dir}_internal/brand/claims-and-evidence.md",
      "${map.dir}_internal/brand/copy-patterns.md",
      "${map.dir}_internal/brand/copy-review.md",
      "${map.dir}_internal/brand/demand-canon.md",
      "${map.dir}_internal/brand/messaging.md",
      "${map.dir}_internal/brand/positioning.md",
      "${map.dir}_internal/brand/register-bridge.md",
      "${map.dir}_internal/brand/visual-identity.md",
      "${map.dir}_internal/agent-integration-coverage.md",
      "${map.dir}_internal/cross-agent-behaviour-reference.md",
      "${skills.dir}/discern-brand-voice/SKILL.md",
      "${skills.dir}/discern-product-voice/SKILL.md",
      "${skills.dir}/discern-agent-voice/SKILL.md",
      ".vale/DiscernBrand/ProductName.yml",
      ".vale/DiscernBrand/GenericVerbs.yml",
      ".vale/DiscernBrand/GenericAdjectives.yml",
      ".vale/DiscernBrand/TemplateOpener.yml",
      ".vale/DiscernBrand/CtaGenericLabel.yml",
      ".vale/DiscernBrand/RepeatedContrast.yml",
      ".vale/DiscernBrand/StackedSlogans.yml",
      ".vale/DiscernProduct/ProductName.yml",
      ".vale/DiscernProduct/AgentBlame.yml",
      ".vale/DiscernAgent/BestJudgment.yml",
      ".vale/DiscernAgent/PositionalReference.yml",
      "site/pages/assets/search.js",
      "templates/skills/discern-write-adr/skeleton/docs/_adr/0000-template.md",
      "templates/skills/discern-write-adr/skeleton/docs/_adr/0001-adopt-discern.md",
      "templates/skills/discern-write-adr/skeleton/docs/_adr/README.md",
      ".github/cla-assistant/metadata",
      "THIRD_PARTY_NOTICES",
      "src/lib/first_party_license_bundle.ts",
      "src/lib/third_party_bundle.ts",
      "scripts/jsr_license_cache.json",
    ]
    run = "deno task codegen"
    linguist_generated = true
    # Warm runs finish in seconds; a compile-graph change re-fetches third-party
    # license metadata, so the group gets two minutes instead of the global ten.
    timeout = 120

# ─────────────────────────────────────────────────────────────────────────────
# [acceptance] — standing grants for landing. Each entry names a scope whose
# changes may land without a per-landing conversation. The owner records this
# decision on the trunk. Scope definitions become consent-bearing: widening a
# named scope widens its grant. An empty list changes nothing; landing asks for
# the owner's acceptance as it does today. The example grants pure documentation
# only; agent-instruction surfaces stay owner-reviewed.
# ─────────────────────────────────────────────────────────────────────────────

[acceptance]
  pre_authorized = ["map"]

# ─────────────────────────────────────────────────────────────────────────────
# [worktree] — the isolated-worktree workflow. The git mechanics are generic;
# everything project-specific is a RESOURCE you declare below. A fresh install
# declares none, so a worktree round is a clean no-op until you wire one.
# ─────────────────────────────────────────────────────────────────────────────

[worktree]
  # Where per-worktree checkouts are created (a <name> dir is made under it).
  #   ""  (the default) a SIBLING of the repo, "<repo>.worktrees/<name>" — visible
  #       and adjacent, never nested inside the checkout (a worktree nested in its
  #       own repo is an anti-pattern: recursive tools double-count it, and walking
  #       up to the repo root mis-resolves the worktree's .git file).
  #   a RELATIVE path resolves against the repo root (".claude/worktrees" nests
  #       them inside the repo; "../wts" a custom sibling).
  #   an ABSOLUTE path is used as-is.
  root = ""

  # Environment values copied from the main checkout's .env into a new worktree's
  # .env (secrets a fresh worktree needs but that aren't in version control).
  inherit_env = [] # e.g. ["APP_KEY", "OPENAI_API_KEY"]

  # The env files the worktree lifecycle reads and writes, in precedence order:
  # when reading, the last listed file that defines a value wins (the dotenv
  # override convention); a newly written value lands in the first. inherit_env
  # reads these in the main checkout and writes the worktree's copy; the
  # deterministic port and resource handles are recorded into them too.
  env_files = [".env", ".env.local"]

  # Give each worktree a deterministic dev-server port (hashed from its id) so
  # concurrent worktrees never collide. Read it with `discern identity --port`.
  # This is derived IDENTITY, not a resource — it provisions nothing.
  port = true

  # Track ignored files at worktree setup and report top-level ignored paths that
  # changed before the worktree is removed. Turn this off for projects whose
  # ignored outputs churn too much to be useful.
  ignored_file_drift = true

    # ─────────────────────────────────────────────────────────────────────────────
    # [worktree.resources.<name>] — per-worktree external resources (a database, an
    # emulator, a container, a queue). Each declares a `create` command (run once at
    # setup) and a `destroy` (run once at teardown), with optional `ensure`
    # (re-readiness at session start), `required` (default true: a create failure
    # aborts setup), `retries` (default 0), and `gc` (default true: may orphan-prune
    # reclaim it). Resources are CREATED top-to-bottom and DESTROYED bottom-to-top.
    # Commands run via `sh -c` after @…@ token expansion; an empty command is a clean
    # no-op. A worktree that vanishes without a clean teardown has its resources
    # reclaimed by `discern worktree prune` (the GC safety net) — so author `create` AND
    # `destroy` idempotent (`create` is skipped for an already-provisioned resource;
    # `destroy` may re-run via prune) and cwd-independent (prune runs `destroy` from the
    # main checkout: use @…@ handles or absolute paths, not relative ones).
    #
    # Runtime tokens (expanded per-worktree, at run time):
    #   @worktree@      this worktree's base handle   (slug-id)
    #   @resource@      this resource's handle        (slug-id-name; this resource only)
    #   @db@            database-name-safe identity    (underscores; for db engines)
    #   @site@          dev-server site/host name      (DNS-safe; for vhosts/tunnels)
    #   @port@          the deterministic dev-server port
    #   @project_slug@  your project slug
    #   @dir@           this worktree's root
    # Read a handle back from a project script with `discern identity --resource <name>`
    # (also exported into the worktree's .env as DISCERN_RESOURCE_<NAME>).
    # ─────────────────────────────────────────────────────────────────────────────

    # A per-worktree database, so tests never clash. Uses @db@ (db-name-safe).
    # [worktree.resources.db]
    # create  = "createdb -T @project_slug@_template @db@"
    # destroy = "dropdb --if-exists @db@"

    # A per-worktree dev-server site (a Docker vhost, an ngrok tunnel, a reverse-proxy
    # entry, …). Uses @site@ (DNS-safe). Declared after db so it is torn down first.
    # [worktree.resources.dev_server]
    # create  = "link-site @site@ @port@"
    # destroy = "unlink-site @site@"

    # Any other isolated resource — an emulator, a queue, a bucket, a namespace.
    # [worktree.resources.example]
    # create   = "make-thing @resource@"
    # destroy  = "destroy-thing @resource@"   # idempotent: may re-run via worktree prune
    # ensure   = "ensure-thing @resource@"   # optional: reconcile drift at session start
    # required = true                          # optional: false = create failure is non-fatal
    # retries  = 0                             # optional: retry create/destroy N times
    # gc       = true                          # optional: false = never orphan-prune it
    #                                          #   (teardown-only; for data-loss-sensitive ones)

    # A harmless temp-dir probe so this repo dogfoods the full resource lifecycle
    # without depending on an external service. It exercises token expansion, the
    # resource ledger, ensure, teardown, and orphan-prune reclamation.
    [worktree.resources.lifecycle-probe]
      create = "mkdir -p /tmp/discern-worktree-resources/@resource@ && printf 'worktree=%s\\nresource=%s\\ndir=%s\\nport=%s\\n' '@worktree@' '@resource@' '@dir@' '@port@' > /tmp/discern-worktree-resources/@resource@/marker"
      ensure = "mkdir -p /tmp/discern-worktree-resources/@resource@ && printf 'worktree=%s\\nresource=%s\\ndir=%s\\nport=%s\\n' '@worktree@' '@resource@' '@dir@' '@port@' > /tmp/discern-worktree-resources/@resource@/marker"
      destroy = "rm -rf /tmp/discern-worktree-resources/@resource@"

  # Worktree setup commands, run after resources are provisioned:
  #   steps   one-shot scaffolding, run once at creation.
  #   ensure  linked-worktree convergence that may depend on identity, ports, or
  #           resources. Checkout-generic dependency and Vale convergence live in
  #           [repository].ensure so acceptance also readies the main checkout.
  # Both run in order via `sh -c`. A failed `ensure` aborts setup at creation; on a
  # re-entry or update it is recorded but never undoes a merge or blocks startup.
  [worktree.setup]
    steps = [] # one-shot scaffolding (none needed here)
    # Link the private documentation overlay (project/map/_private/, present only
    # in the main checkout) into each linked worktree at the same canonical path;
    # a checkout without the overlay sees a silent no-op, and a session-start
    # re-run heals a broken link.
    ensure = [
      "deno run --allow-read --allow-write --allow-run=git project/scripts/ensure_private_docs.ts",
    ]

  # ─────────────────────────────────────────────────────────────────────────────
  # [standards] — quality standards: numbers that can never get worse. Every
  # `discern done` run verifies no limit loosened versus the trunk (always — that
  # check has no off switch) and measures each standard in parallel with the
  # tests, so a branch can neither quietly loosen a limit nor quietly regress a
  # metric. None configured means none run — defining one is what turns the
  # subsystem on.
  #
  # Each limit may only improve: line coverage, a bundle-size budget, a lint/type-
  # error count, a perf budget. Sort the number before holding it: an invariant a
  # healthy project never adds (suppressions, a banned pattern) holds the raw
  # count; a quality that scales (coverage, alert density) holds a rate via
  # `per`; a total that grows with the product (a size, a word count) needs
  # `margin` and an owner willing to raise the limit as the product grows —
  # pinned at today's value it fails the next legitimate change.
  #
  # Each [standards.<name>] table declares one:
  #   metric     the metric name the run emits        (default: the standard name)
  #   direction  required:
  #              "up"   value should rise; limit is a FLOOR   (e.g. coverage)
  #              "down" value should fall; limit is a CEILING (e.g. a size budget)
  #   limit      the floor/ceiling — compared vs main, so a floor may only rise and
  #              a ceiling may only fall (you can't loosen the gate on a branch)
  #   run        the command that measures it — its output emits the metric line
  #              (run by the gate alongside the tests, and by `discern standards`)
  #   per        divide the metric to hold a RATE, not a raw count — so the number
  #              doesn't rise just because the project grew. Either a second metric the
  #              run emits, or a built-in extent discern measures itself:
  #              per = { words = "${map.dir}**" }  (files | lines | words | bytes over a pathspec)
  #   scale      multiply the rate so the limit reads in human units (e.g. 1000)
  #   margin     headroom `discern standards --pin` leaves when it tightens this limit
  #              to the measured value (default 0). Give a metric that drifts on
  #              unrelated commits (a size, a coverage %) a margin so a pinned limit
  #              isn't tripped by ordinary fluctuation.
  #   inputs     the paths the metric reads (scope-style globs). When nothing under
  #              them changed since the last recorded measurement, the gate replays
  #              that value instead of re-measuring — a docs-only change pays
  #              seconds, not a coverage run. Honest risk: too-narrow inputs delay
  #              detection until the next measured run. Omit to always measure.
  #   timeout    seconds; replaces the global [gate].timeout for this measurement
  #              job only (0 disables its bound)
  #   measure    "gate" (default) measures in every `discern done`; "on-demand"
  #              defers a metric genuinely too slow for every gate run to
  #              `discern standards` — the never-loosen limit check still runs on
  #              every gate. Reach for the smaller reliefs first: declare `inputs`
  #              so unchanged trees replay for free, or raise this job's `timeout`.
  #
  # A standard's `run` reports its number by printing a line:
  #   DISCERN_METRIC <name> <number>
  # (the LAST such line wins). There is no built-in or special standard — coverage
  # is just the conventional name for one. None are configured by default;
  # uncomment an example to enable it.
  #
  # Captured a gain? `discern standards --pin` tightens each improved limit to the
  # value just measured and commits it — the way to tighten a standard, never a
  # hand-edit (which can't tell a real gain from a quiet loosening).
  # ─────────────────────────────────────────────────────────────────────────────

  # Coverage standard — hold src/ line coverage at or above a rising floor. The run
  # executes the suite under Deno coverage and emits DISCERN_METRIC coverage <pct>
  # for the repo's own src/ tree (the installer AND the TS engine — both
  # instrumented; scripts/coverage_lib.ts anchors the filter so dependency and
  # workspace src/ segments never count). Deferred from the gate's measurement
  # pass with the honest reason: it re-runs the ENTIRE test suite under
  # instrumentation, roughly doubling the gate's slowest job — the pathological
  # case the opt-out exists for. The never-loosen floor check still runs on every
  # `discern done`; CI measures it on every PR, and `discern standards` on demand.
  # `inputs` names everything the measurement reads, so a tree that touches none
  # of it (docs, map, site) replays the recorded value for free; `margin` keeps a
  # pin from setting the floor razor-tight against ordinary coverage drift.
  [standards.coverage]
    direction = "up"
    limit = 91.7
    margin = 0.5
    run = "deno task coverage"
    timeout = 1200
    inputs = [
      "src/**",
      "tests/**",
      "templates/**",
      "scripts/coverage.ts",
      "scripts/coverage_lib.ts",
      "deno.json",
      "deno.lock",
    ]
    measure = "on-demand"

  # Prose standard — hold the map's Vale alert *density* at or below a falling ceiling.
  # `deno task prose` runs Vale over the map and emits DISCERN_METRIC prose <count>
  # (every severity; error-severity findings are separately blocked by the gate via
  # [jobs.prose]). The same staged corpus emits `prose_words`, so frontmatter and
  # every `_private` subtree contribute to neither side of the ratio. The standard
  # tracks alerts per 1,000 linted words — a *rate*: writing more docs never
  # breaches it, only writing nittier-than-average prose does. Held by `discern
  # standards`, enforced on every PR in CI. Lower the limit as the density
  # improves — the ceiling only falls. `inputs` names what the metric reads (the
  # map, Vale's tracked toolchain, and the wrapper scripts), so a code-only change
  # replays the recorded density instead of re-running Vale.
  [standards.prose]
    direction = "down"
    per = "prose_words"
    scale = 1000
    # Corrected from the mismatched whole-map denominator: 4,863 alerts across
    # 312,085 staged words. Private prose and frontmatter stay outside the rate.
    limit = 15.15
    run = "deno task prose \"${map.dir}\""
    inputs = [
      "${map.dir}**",
      ".vale-assets.json",
      ".vale-version",
      ".vale.ini",
      ".vale/Discern/**",
      ".vale/DiscernAgent/**",
      ".vale/DiscernBrand/**",
      ".vale/DiscernProduct/**",
      "scripts/prose.ts",
      "scripts/prose_lib.ts",
      "scripts/vale_lib.ts",
      "scripts/vale_toolchain.ts",
      "src/lib/frontmatter.ts",
    ]

  # Public-site prose Standards — one registry-derived, markup-free corpus feeds
  # the blocking Vale check, alert-density numerator, word denominator, and
  # reading-grade measure. Repeated rendered copy and code contribute to none of
  # them. New marketing routes enroll through site/marketing_pages.ts.
  # Temporarily disabled while the V3 public-site wording settles. Restore this
  # table before launch; project/TODO.md carries the explicit follow-up.
  # [standards.site_prose]
  #   direction = "down"
  #   per = "site_prose_words"
  #   scale = 1000
  #   # Guarded-corpus baseline: 2 Vale alerts across 1,025 projected words.
  #   limit = 1.952
  #   margin = 0.05
  #   run = "deno task site:prose"
  #   inputs = [
  #     "site/**",
  #     "src/lib/providers.ts",
  #     "src/shared/agent_catalogue.ts",
  #     ".vale-assets.json",
  #     ".vale-version",
  #     ".vale.ini",
  #     ".vale/Discern/**",
  #     ".vale/DiscernBrand/**",
  #     "scripts/site_prose.ts",
  #     "scripts/site_prose_check.ts",
  #     "scripts/site_prose_lib.ts",
  #     "scripts/prose_lib.ts",
  #     "scripts/plain_reading_grade_lib.ts",
  #     "scripts/vale_lib.ts",
  #     "scripts/vale_toolchain.ts",
  #     "deno.json",
  #     "deno.lock",
  #   ]

  [standards.site_reading_grade]
    direction = "down"
    # Guarded-corpus baseline over the same deduplicated prose blocks.
    limit = 8.43
    margin = 0.5
    run = "deno task site:reading-grade"
    inputs = [
      "site/**",
      "src/lib/providers.ts",
      "src/shared/agent_catalogue.ts",
      "scripts/site_reading_grade.ts",
      "scripts/site_prose_lib.ts",
      "scripts/prose_lib.ts",
      "scripts/plain_reading_grade_lib.ts",
      "deno.json",
      "deno.lock",
    ]

  # The /agents page tells its reader that context is a budget, then caps its
  # own prose so the claim stays true. The page prints this ceiling and tests
  # hold the printed number equal to the limit below, so moving one moves both.
  [standards.agents_page_words]
    direction = "down"
    limit = 1000
    run = "deno task site:agents-words"
    inputs = [
      "site/**",
      "src/lib/providers.ts",
      "src/shared/agent_catalogue.ts",
      "scripts/agents_page_words.ts",
      "scripts/site_prose_lib.ts",
      "scripts/prose_lib.ts",
      "scripts/plain_reading_grade_lib.ts",
      "deno.json",
      "deno.lock",
    ]

  # Selected site-component gap standard — hold the raw number of components
  # emitted for a route bundle but absent from that bundle's live HTML output at
  # or below a falling ceiling. The package manifest supplies groups,
  # dependencies, and owned classes; the site's bundle and route registries
  # supply the consumer side. A raw deficit cannot improve by diluting a
  # percentage with more components. The design-system 0.26.1 adoption baseline
  # is 50 gaps: 3 in docs and 47 in compositions. Drive it to zero by rendering
  # a selected component or narrowing an unused selection; at zero, make absence
  # an always-on test and retire this transition Standard.
  [standards.site_component_gaps]
    direction = "down"
    limit = 50
    run = "deno task site:component-coverage"
    inputs = [
      "${map.dir}**",
      "site/**",
      "scripts/**",
      "src/**",
      "deno.json",
      "deno.lock",
    ]

  # Vocabulary standard — hold the map's vocabulary debt at zero. `deno task vocab`
  # reads the term registry and the live map pages, counts dead terms (a glossary
  # entry no page names or links) and redefinitions (a page restating a term
  # bold-faced instead of linking its glossary entry), and emits
  # DISCERN_METRIC vocabulary_debt <count>. At zero, a term added to the registry
  # must be used by a page in the same change, and a second definition of a term
  # fails the gate. Bold emphasis stays legal when it carries the link:
  # `**[term](…/glossary.md#anchor)**`. `inputs` names what the metric reads, so
  # a code-only change replays the recorded value.
  [standards.vocabulary]
    metric = "vocabulary_debt"
    direction = "down"
    limit = 0
    run = "deno task vocab \"${map.dir}\""
    inputs = [
      "${map.dir}**",
      "scripts/vocab_signals.ts",
      "scripts/vocab_signals_lib.ts",
      "scripts/glossary_registry.ts",
      "src/lib/docs_integrity.ts",
      "src/lib/markdown.ts",
      "src/lib/frontmatter.ts",
    ]

  # Plain-register reading grade — hold the feature canon's plain-language
  # axis at or below a falling reading-grade ceiling. The measurement is a
  # deterministic Flesch-Kincaid grade over every node's plain what/why/agent
  # prose (scripts/plain_reading_grade_lib.ts), with code spans read as
  # one-word names so quoting a command never charges the register. The plain
  # canon exists for non-technical readers; this is the numeric guard that the
  # register stays plain as agents grow it — vocabulary is policed by the
  # register guard test, and simplicity is held here. Pure in-memory text
  # arithmetic: milliseconds, so it measures in every gate run.
  [standards.plain_reading_grade]
    direction = "down"
    limit = 13.45
    margin = 0.2
    run = "deno run scripts/plain_reading_grade.ts"
    inputs = [
      "scripts/feature_registry.ts",
      "scripts/glossary_registry.ts",
      "scripts/plain_reading_grade.ts",
      "scripts/plain_reading_grade_lib.ts",
      "src/shared/capabilities.ts",
      "src/shared/agent_catalogue.ts",
    ]

  # Deno-lint suppression standard — hold the raw count of both recognized
  # comment directives (`deno-lint-ignore` and `deno-lint-ignore-file`) at or
  # below a falling ceiling. The structural detector scans every authored
  # JavaScript/TypeScript source from the Git-derived universe, so examples in
  # strings and block comments do not count and new source trees auto-enroll.
  # Fix a named lint finding, then run
  # `discern standards --pin lint_suppressions` to capture the lower census.
  # At zero, move the detector into an always-on test and retire this table.
  [standards.lint_suppressions]
    direction = "down"
    limit = 6
    run = "deno task lint-suppressions"
    inputs = [
      "*.ts",
      "*.tsx",
      "*.mts",
      "*.cts",
      "*.js",
      "*.jsx",
      "*.mjs",
      "*.cjs",
      "deno.json",
    ]

  # Ambient-read boundary standard — direct Deno.env/Deno.cwd composition stays
  # in the syntax-aware registry, while default-parameter reads remain ordinary
  # injectable seams. The raw module count is an invariant: new host boundaries
  # need an owner decision, and removing one permanently lowers the ceiling.
  [standards.ambient_read_boundaries]
    direction = "down"
    limit = 38
    run = "deno task ambient-boundaries"
    inputs = [
      "scripts/ambient_state_lint.ts",
      "scripts/ambient_state_boundary_counts.ts",
      "deno.json",
    ]

  # Process-environment mutation boundary standard — the explicit registry is
  # empty after the landing-refresh migration. The zero ceiling prevents a
  # future Deno.env.set/delete exception from being added on a feature branch;
  # the lint rule separately rejects every unregistered call.
  [standards.ambient_mutation_boundaries]
    direction = "down"
    limit = 0
    run = "deno task ambient-boundaries"
    inputs = [
      "scripts/ambient_state_lint.ts",
      "scripts/ambient_state_boundary_counts.ts",
      "deno.json",
    ]

  # Instruction-footprint standard — the bundled built-in instructions (templates/instructions/
  # *.md) compiles into every end-user agent's context in every session, so its total
  # word count is a context-window budget we spend on their behalf.
  # A sentence earns static delivery only by the routing test (ADR 0192): it must be
  # needed BEFORE the first relevant tool call, and that call must be unable to
  # deliver it. Mechanics an envelope, refusal, or tool description already carries
  # belong to that channel, not here. Standing exemptions — the channel-down CLI
  # fallback, and destructive-class rules that verb-bypassing edits can violate
  # (trunk edits, worktree adoption) — stay static and may repeat.
  # Raise the limit only for instructions that passes the routing test. Never pay for a
  # necessary instruction by weakening another one; if no redundant wording remains,
  # report the intrinsic growth so the owner can move this growing-total ceiling.
  [standards.instructions]
    metric = "instruction_words"
    direction = "down"
    limit = 1530
    run = "echo DISCERN_METRIC instruction_words $(cat templates/instructions/*.md | wc -w)"
    inputs = ["templates/instructions/**"]

  # Bundled-skills surface — every skill description rides in every agent session
  # of every project discern is installed in, so the surface is held from growing
  # back after the seven-skill trim: the bundled count and the words across every
  # SKILL.md frontmatter block (descriptions plus a small fixed identity overhead
  # per skill) are both ceilings. Frontmatter is measured rather than the
  # description line alone so a multi-line description can never slip under the
  # count. Growing either number is an owner decision, taken on the trunk.
  [standards.skills_count]
    metric = "skills_count"
    direction = "down"
    limit = 10
    run = "echo DISCERN_METRIC skills_count $(ls templates/skills | wc -l)"
    inputs = ["templates/skills/**"]

  [standards.skills_words]
    metric = "skills_words"
    direction = "down"
    limit = 1040
    run = "echo DISCERN_METRIC skills_words $(awk 'FNR==1{f=0} /^---$/{f++;next} f==1' templates/skills/*/SKILL.md | wc -w)"
    inputs = ["templates/skills/**"]

  # Binary-size standard — hold one representative release artifact at or below a
  # falling ceiling. The measurement builds x86_64-unknown-linux-gnu and stats the
  # resulting dist/discern-* binary, avoiding macOS codesigning noise while still
  # protecting the shipped single-file executable from silent growth. Re-baseline
  # only for deliberate release-surface changes or Deno compiler/runtime shifts.
  # Deferred from the gate's measurement pass with the honest reason: it compiles
  # a full release binary — minutes of work no per-commit gate should pay. The
  # never-loosen ceiling check still runs on every `discern done`; CI and
  # `discern standards` measure it.
  [standards.binary_size]
    metric = "binary_size_bytes"
    direction = "down"
    limit = 147500000
    measure = "on-demand"
    # The binary's byte count drifts with every commit, so `discern standards --pin`
    # leaves 1 MB of headroom when it re-pins this ceiling — capturing a real size
    # win without pinning to an exact value the next commit would breach.
    margin = 1000000
    run = "deno run --allow-read --allow-write --allow-env --allow-run scripts/binary_size.ts x86_64-unknown-linux-gnu"

  # Public-manual leaf-density standard — hold the public instructions corpus at or
  # above a rising floor of non-README Markdown leaves per 10,000 words. The
  # corpus is the projection every published surface serves, composed from the
  # document model's own predicates: underscore-prefixed subtrees (_private,
  # _internal, _adr) are excluded so private notes and ADR churn cannot satisfy
  # or breach the budget; the manual section registry withholds contributor
  # tiers, which absorb material cut from public pages and are deliberately
  # unbudgeted here; and the publication predicate admits only published pages,
  # so a `publish: false` page counts toward neither number until it publishes.
  [standards.public_doc_leaf_density]
    metric = "public_doc_leaves"
    direction = "up"
    per = "public_doc_words"
    scale = 10000
    limit = 10.773629470020305
    # Deepening an existing page is legitimate growth: at the current corpus size
    # the margin keeps roughly a thousand words of room for it before a new leaf
    # is due, and re-pins leave the same headroom.
    margin = 0.5
    run = "deno run --allow-read scripts/public_doc_density.ts \"${map.dir}\""
    inputs = [
      "${map.dir}**",
      "scripts/public_doc_density.ts",
      "scripts/public_doc_density_lib.ts",
      "src/lib/frontmatter.ts",
      "src/lib/docs.ts",
      "src/lib/paths.ts",
    ]

  # ─────────────────────────────────────────────────────────────────────────────
  # [checkpoints.<name>] — change-triggered review rules: a deterministic trigger
  # decides when a diff makes a named question relevant; the agent judges it and
  # records a conclusion that travels with the Proof as agent evidence. The
  # config at an effort's merge-base with the trunk governs it, so these entries
  # take effect for new efforts once they land. This repo ships the built-in set
  # and runs under it: the full field reference lives in the config template and
  # `discern docs`.
  # ─────────────────────────────────────────────────────────────────────────────

  # Four stop checkpoints guard the knowledge surfaces — the ones that steer
  # every future agent session. `discern done` pauses before the gate until the
  # agent declares each fired question met, or unmet with a rationale.
  # Map checkpoint subjects exclude generated artifacts, so two
  # authored Map files now mark a broad change. One batched declaration per
  # effort is the intended tax; the checkpoint-noisy detector re-adjudicates
  # from post-landing history for the owner.
  [checkpoints.map-focus] # a broad map change must reduce future reading
    min_changed_files = 2
    teach = "Remove stale material, link the authority, and cut mechanically derivable prose."
  [checkpoints.instruction-economy] # always-loaded prose pays rent in every session
  [checkpoints.skills-playbook] # a skill is an executable playbook
  [checkpoints.gotchas-playbook] # failure memory stays symptom → cause → recovery
  # Published pages first pass the configured Map selector, then this read-only
  # command consults the manual-tier registry and page publication predicate.
  # The command reports exact matched paths, including deleted public blobs.
  [checkpoints.public-doc-audience]
    paths = ["${map.dir}**"]
    when = "deno run --quiet --no-prompt --allow-read --allow-env=DISCERN_CHECKPOINT_INPUT --allow-run=git project/scripts/public_doc_checkpoint.ts"
    mode = "stop"
    question = "Does every changed published page work for a reader without repository context — defining terms at first use, avoiding internal shorthand and contributor instructions, linking only reachable context, stating the operating facts needed at point of use, and keeping examples accurate?"
    teach = "Published pages must carry their own usable context; the matcher admits only the canonical public document model."

  # Authored distribution bytes need a portability judgment; generated template
  # output remains excluded by the checkpoint engine's default.
  [checkpoints.templates-stay-generic]
    paths = ["templates/**"]
    mode = "stop"
    question = "Does every changed authored distribution byte — including examples, placeholders, and instructions — read correctly in any project and domain, without discern-repository vocabulary or inaccessible internal citations?"

  # This deliberate overlap with templates-stay-generic is tiny and batched:
  # portability and always-loaded context-window rent are different judgments.
  [checkpoints.shipped-instruction-rent]
    paths = ["templates/instructions/**"]
    mode = "stop"
    question = "Is every changed always-loaded sentence needed before the first relevant tool call, and unable to be delivered at its point of contact?"

  # Only authorities that define or apply Gate evidence, declarations, consent,
  # grants, variances, and the acceptance transition belong in this list.
  [checkpoints.authority-boundary]
    paths = [
      "src/engine/gate/execute.ts", # decides whether machine Gate work succeeded
      "src/engine/gate/proof.ts", # binds machine results to the exact tree
      "src/engine/checkpoints/evidence.ts", # binds agent declarations to evidence
      "src/engine/checkpoints/subject.ts", # fingerprints the question and subject
      "src/engine/checkpoints/open_questions.ts", # stores and checks declarations
      "src/engine/checkpoints/preflight.ts", # interlocks declarations before the Gate
      "src/shared/declarations.ts", # owns declaration-gated acts and refusals
      "src/shared/consent.ts", # owns consent sources and consent-gated effects
      "src/engine/worktree/effort_grant.ts", # validates the effort-scoped grant
      "src/engine/worktree/effort_grant_writer.ts", # creates that exact grant
      "src/engine/worktree/effort_grant_cleanup.ts", # claims, restores, and consumes it
      "src/engine/worktree/landing_authority.ts", # resolves recorded or conversational authority
      "src/engine/worktree/acceptance_checkpoints.ts", # requires exact owner variances
      "src/engine/worktree/acceptance_transaction.ts", # binds consent to the exact effect
      "src/engine/worktree/lifecycle.ts", # sequences the acceptance interlocks and effects
    ]
    mode = "stop"
    question = "Does this change preserve the three evidence classes and the Boundary Canon — machine success grants no landing authority, agent declarations are not machine verification, grants never cover a variance, and each effect requires the exact applicable consent?"

  # An ADR addition is the decision moment; later corrections to an existing
  # record do not need this advisory.
  [checkpoints.adr-quality]
    paths = ["${map.dir}_adr/**"]
    kinds = ["added"]
    mode = "advise"
    question = "Does this new ADR state the decision, real alternatives, consequences, and enduring reason, rather than narrating implementation?"

  # A product behavior, result boundary, or agent hint can change without
  # updating every registry region that explains what it buys each audience.
  # The bounded matcher compares the three regions independently; merely
  # touching their shared source file cannot suppress the advisory.
  [checkpoints.feature-benefit-currency]
    paths = [
      "src/main.ts",
      "src/engine/**",
      "src/shared/hints.ts",
      "src/shared/result*.ts",
      "templates/**",
      "scripts/brand/claims.ts",
    ]
    when = "deno run --quiet --no-prompt --allow-read --allow-env=DISCERN_CHECKPOINT_INPUT --allow-run=git project/scripts/feature_benefit_currency_checkpoint.ts"
    mode = "advise"
    question = "Does this change add or alter a user-visible capability, result, boundary, or agent-facing hint, and is every unchanged Feature, Human Benefit, or Agent Benefit Canon region still complete?"
    teach = "The matcher compares all three canon regions independently; an unchanged region may be correct, but it still needs review."

  # These are the narrow source authorities for published config/result,
  # CLI/MCP, Proof-note, and Logbook contracts. Generated projections remain
  # mechanical guards; the checkpoint asks the residual compatibility judgment.
  [checkpoints.public-contract]
    paths = [
      "src/shared/config_schema.ts", # owns accepted configuration shape
      "src/shared/public_schemas.ts", # owns published schema ids and versions
      "src/shared/config_codegen.ts", # projects the public config contract
      "src/shared/result.ts", # owns the shared result envelope vocabulary
      "src/shared/result_schemas.ts", # owns runtime and Proof-note schemas
      "src/shared/result_contracts.ts", # registers public result contracts
      "src/shared/result_formats.ts", # owns public CLI result formats
      "src/shared/result_serialization.ts", # projects CLI JSON and MCP content
      "src/shared/result_codegen.ts", # projects public result artifacts
      "src/shared/verbs.ts", # owns the published verb set
      "src/main.ts", # declares the live CLI command tree
      "src/engine/mcp/server.ts", # declares the live MCP tool registry
      "src/engine/gate/proof_notes.ts", # reads and writes the durable Proof schema
      "src/engine/logbook/schema.ts", # owns the durable Logbook event vocabulary
      "scripts/public_schema_compatibility.ts", # enforces the declared schema policy
    ]
    mode = "advise"
    question = "Is the changed public contract compatible under its declared policy, with any migration or versioning explicit and user documentation and generated artifacts following it?"

  # Six advisory checkpoints read the shape of the change — never blocking,
  # delivered with the gate's advisories when their pattern appears. The two
  # breadth thresholds stay tuned above the shipped defaults for this repo.
  # A replay of the last 60 landed efforts (proof-note landing boundaries on
  # the fast-forward trunk), classified with each landing's governing
  # [generated] model, put the shipped 15/25 on 78%/57% of AUTHORED breadth —
  # advisory wallpaper — while generated fan-out flipped only 2 of 60
  # landings at any tuned threshold: the breadth is authored launch-phase
  # programme waves, not codegen. At 25/40 the advisories fire on 57%/47% of
  # that window, whose scale overstates steady state. Re-review against
  # `discern patterns` economics once post-launch history accumulates.
  [checkpoints.deletion-heavy-change] # a substantial cut: proven dead, recoverable?
  [checkpoints.parallel-implementation] # a name-similar sibling file appeared
  [checkpoints.new-binary-asset] # a newly added binary needs reviewable provenance

  [checkpoints.effort-sprawl] # one effort, or several riding along?
    min_changed_files = 40

  [checkpoints.docs-drift] # code moved and the map did not

  [checkpoints.commit-story] # a large change: do the messages tell the why?
    min_changed_files = 25

# ─────────────────────────────────────────────────────────────────────────────
# [gate] — ergonomics for the parallel gate stages (and scope gates). These
# affect how `discern done` runs its concurrent jobs.
# ─────────────────────────────────────────────────────────────────────────────

[gate]
  # Controls static terminal transcripts only: false groups complete per-job output;
  # true streams prefixed lines. Live-capable terminals always show the Gate frame's
  # bounded tail. CI, pipes, --plain, and no-cursor terminals are static. Off by default.
  stream = false

  # Cancel the in-flight sibling commands the moment one fails, instead of running
  # every command to completion. ON by default — an agent-driven gate wants a fast
  # abort. Set false to run every job and see all failures in one pass. The engine
  # tree-kills a cancelled job's whole process group (Deno `detached` + `Deno.kill`),
  # so its grandchildren don't linger.
  fail_fast = true

  # Per-command time budget in SECONDS, applied to every job the gate runs (each
  # capability, check, scope gate, and standard measurement). A command that
  # doesn't exit within it is tree-killed and the stage fails with a plain-language
  # timeout diagnostic — so the gate can never hang. The usual culprit is a
  # watch-mode test runner or a dev server wired without its single-run form.
  # Generous by default (600 = 10 min); set 0 to disable the limit (not
  # recommended — the gate can then hang forever). One legitimately slow job takes
  # its own `timeout` on its config entry instead of a slower global.
  timeout = 600

  # Cap on how many test-stage runs may be in flight AT ONCE across every checkout
  # of this repository — the main checkout and all its linked worktrees. It counts
  # whole runs (`discern done`'s and `discern test`'s test group, and `discern
  # standards`' measurement pass); each suite's own Deno worker policy remains
  # independent. A run arriving past the cap waits for a slot before its tests
  # start (fix and check stages never wait), says what it is waiting for, and
  # continues the moment a slot frees. 0 means no cap.
  concurrent_test_runs = 2

# ─────────────────────────────────────────────────────────────────────────────
# [coupling] — co-change detection: a read-only advisory that mines git history
# for files that change TOGETHER, so a touched file's habitual sibling isn't
# forgotten. Read it on demand with `discern coupling` (no argument → what
# co-changes with your current change set but is MISSING from it; `discern
# coupling <path>` → one file's top partners, its blast radius; `discern coupling
# <a> <b>` → the commits where both changed, to judge a coupling). It is
# ZERO-CONFIG: it self-calibrates to your repo (commit size, cadence, scale), so
# there are no thresholds to tune. As an ADVISORY, it points at where to look.
# ─────────────────────────────────────────────────────────────────────────────

[coupling]
  # Surface the advisory during the gate too — `discern done` AND the fast inner
  # loop `discern prepare` (as hints, at the tail — it never affects pass/fail), so
  # the nudge meets a change while it is hot. On by default; set false to keep
  # coupling on demand.
  in_gate = true

# ─────────────────────────────────────────────────────────────────────────────
# [scripts] — your own executable project scripts. Drop any executable into the
# directory below; `discern scripts` lists it and `discern scripts <name>` runs it.
# An optional `# desc: ...` line describes it in the listing. This directory is
# yours: `discern upgrade` never writes or refreshes anything here. Built-in names
# are legal because project scripts live under their own command namespace. A
# project script can use any language; discern exports DISCERN_* environment values
# (DISCERN_ROOT, DISCERN_SCRIPTS, DISCERN_TRUNK, …) and forwards every
# argument after its name unchanged. It reads config by calling the binary
# (`discern config get <key>`) and resolves worktree
# identity with `discern identity --db|--site|--port|--resource <name>`.
# ─────────────────────────────────────────────────────────────────────────────

[scripts]
  dir = "project/scripts"

# ─────────────────────────────────────────────────────────────────────────────
# [meta] — installer bookkeeping, managed by discern. Nothing here needs your
# attention.
# ─────────────────────────────────────────────────────────────────────────────

[meta]
  # The install schema version — managed by discern (bumped by `discern upgrade`).
  # Don't edit this by hand.
  schema_version = 1
  bootstrapped = true
