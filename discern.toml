#:schema https://discern.sh/schema/v1/discern-config.schema.json
# Generated automatically by discern via the bundled project configuration template | https://discern.sh
#
# discern.toml configures discern for "discern".
#
# Every section opens with what it governs, why it matters, and the command
# that explains it in full: `discern config explain <section>` prints the
# complete reference for a section or a key, with its current value and an
# example.
#
#   discern setup      guided first configuration (ask your coding agent)
#   discern doctor     verify this installation           MCP: discern_doctor
#   discern status     what is true now, and what is next  MCP: discern_status
#   discern docs       the manual                          MCP: discern_docs
#   discern upgrade    bring this file up to date after a new discern version
#
# Generated by discern 1.0.0 for "discern".

# ─────────────────────────────────────────────────────────────────────────────
# [project]
#
# What:    The project's identity and the paths discern keeps for it.
# Why:     The name and slug appear in worktree, branch, and site names and in
#          every compiled instruction file, so agents and humans see one
#          identity everywhere.
#
# Help:    `discern config explain project`
# ─────────────────────────────────────────────────────────────────────────────

[project]
  # discern intentionally self-hosts every configurable authored source under
  # project/ to exercise path overrides; fresh installations keep shipped defaults.

  # Display name, free text, used when compiled instructions address the
  # project. Empty falls back to the slug.
  name = "discern"

  # Short, lowercase, dash-separated identity, used in worktree, site, and
  # branch names.
  slug = "discern"

  # The doc the Gate points an agent at when a stage fails in a non-obvious
  # way. Keep it current with your stack's traps; empty disables the pointer.
  gotchas_doc = "project/map/80-development/done-gate-gotchas.md"

  # Where the deferred-work ledger lives.
  todo = "project/TODO.md"

  # When true, record one line of local, metadata-only history per verb run:
  # timings, outcomes, and names, with no code or output. Files stay under
  # .git, outside commits and any network; false stops all writes.
  # Recording on is recommended. History cannot be recorded after the fact,
  # and while recording is off this project goes without:
  #   - the practice and completion-cost report (`discern patterns`)
  #   - each worktree's last action and work in flight
  #   - fleet activity times that include verb runs
  #   - configuration-change attribution and each standard's limit history
  #   - advisory findings during work and merge-conflict recovery
  #   - wait estimates when concurrent test runs queue
  #   - the in-flight check on the contained-worktree offer
  #   - observed checkpoint economics (`discern checkpoints`)
  #   - Logbook storage checks in `discern doctor`
  logbook = true

  # Which agent integrations to enable: claude_code, codex, gemini, cursor,
  # copilot. Omit the key for the default pair (claude_code, codex); an
  # explicit empty list emits for no agent.
  # Agent files:
  #   "claude_code" -> CLAUDE.md   "codex" -> AGENTS.md   "gemini" -> GEMINI.md
  #   "cursor" -> AGENTS.md   "copilot" -> AGENTS.md
  agents = ["claude_code", "codex", "gemini", "cursor", "copilot"]

# ─────────────────────────────────────────────────────────────────────────────
# [repository]
#
# What:    Policy every checkout of this repository shares.
# Why:     The trunk is where accepted work lands and where the gate compares
#          from. Branch naming and convergence commands keep the main checkout
#          and every linked worktree usable after their tracked tree changes.
#
# Help:    `discern config explain repository`
# ─────────────────────────────────────────────────────────────────────────────

[repository]
  # The shared branch the Gate compares against and completed work lands on.
  # Detected at setup; DISCERN_TRUNK overrides it per invocation.
  trunk = "main"

  # Branch prefix for worktrees created by discern, e.g. "agent/my-feature".
  branch_prefix = "agent/"

  # This repository carries landed proof notes through ordinary fetches. A remote
  # does not need to have published its first proof note. Publishing remains an
  # explicit `git push <remote> refs/notes/discern`.
  proof_notes = "fetch"

  # Idempotent commands that make any checkout usable for its tracked tree,
  # such as installing dependencies from a lockfile. They run in order on every
  # worktree pass and after a landing.
  ensure = [
    "deno install --frozen",
    "deno task site:build",
    "deno task vale:sync",
  ]

# ─────────────────────────────────────────────────────────────────────────────
# [map]
#
# What:    Where the project map lives.
# Why:     The map is the documentation tree agents maintain and `discern map`
#          browses. Its location also feeds the `${map.dir}` reference other
#          sections use.
#
# Help:    `discern config explain map`
# ─────────────────────────────────────────────────────────────────────────────

[map]
  # The directory that holds this project's map.
  dir = "project/map/"

# ─────────────────────────────────────────────────────────────────────────────
# [instructions]
#
# What:    The instruction sources discern compiles into each agent's file.
# Why:     You write instructions once. `discern refresh` compiles discern's
#          built-in instructions plus your sources into one generated file per
#          agent, committed so every agent reads the same page and no generated
#          file is edited by hand.
#
# Help:    `discern config explain instructions`
# ─────────────────────────────────────────────────────────────────────────────

[instructions]
  # Your instruction source file(s), relative to the project root. Globs are allowed.
  # Read only if present; discern's built-in instructions are always prepended.
  sources = ["project/instructions.md"]

# ─────────────────────────────────────────────────────────────────────────────
# [skills]
#
# What:    Where your authored skills live, and which skills to leave out.
# Why:     A skill is a focused, reusable playbook. discern materializes its
#          bundled skills plus yours into each agent's skills directory; a
#          skill of yours with the same name as a built-in replaces it.
#
#   discern skills list          the effective set, and your overrides
#   discern skills eject <name>  copy a built-in here to customize it
#
# Help:    `discern config explain skills`
# ─────────────────────────────────────────────────────────────────────────────

[skills]
  # Where your authored skills live, relative to the project root.
  dir = "project/skills"

  # Skill names, bundled or authored, to leave out of materialization.
  exclude = []

# ─────────────────────────────────────────────────────────────────────────────
# [jobs]
#
# What:    The commands the gate runs, in one namespace.
# Why:     A known name derives its stage; a custom `[jobs.<name>]` table
#          declares one. `discern done` runs the fix stage, then build, then
#          check and test in parallel, and reports what each command returned,
#          so done means the project's own bar was met.
#
# A value is one command, a list run in order, or a table giving the job
# its own time budget: test = { run = "npm test", timeout = 1200 }.
# A long-running command may report its own progress while it runs: print
# DISCERN_PROGRESS {"units":{"kind":"files","completed":3,"total":8}}
# lines and discern presents the counts, and any reported failures, live.
# Leave a known job unwired until its command exists; `discern setup` has
# your coding agent fill these from repository evidence.
#
# Custom:  stage, run, inputs, needs, artifacts, environment, toolchain,
#          provides, timeout
# Help:    `discern config explain jobs`
# ─────────────────────────────────────────────────────────────────────────────

[jobs]
  format = ["deno fmt", "discern tidy"]
  # `deno task codegen` runs as the [generated.codegen] group below — one
  # command, one home; the build job keeps only the uncommitted site output.
  build = "deno task site:build"
  lint = "deno lint"
  typecheck = "deno check"
  # Local gates default to JUnit for per-test Tier-1 diagnostics (file, line,
  # test name) and attributable logbook classes. Hosted full gates select the
  # pretty reporter for readable logs; bare `deno task test` does the same.
  # The shared runner resolves checkout identity once, prints the seed, and
  # passes an explicit replayable shuffle to Deno on every invocation.
  # The budget keeps one-third headroom over the hosted full-suite observation
  # recorded in the testing Map while still bounding a genuine hang.
  test = { run = "deno task coverage", timeout = 10800, toolchain = [".dvmrc", "deno.json", "deno.lock"], environment = ["CI", "PATH", "HOME", "TMPDIR", "DENO_DIR", "DENO_V8_COVERAGE", "DISCERN_GATE_TEST_REPORTER", "LANG", "LC_ALL", "TZ"] }
  smoke = "deno task dev --version"

  # `prose` lints the map with Vale at the check stage. Error-severity findings
  # block map-wide; discern-authored warnings and suggestions block unless
  # scripts/prose_lib.ts registers the rule for editorial review. All findings
  # remain in [standards.prose]. The wrapper stages one blanked mirror first
  # (scripts/prose_lib.ts): Vale measures prose, never metadata.
  # `--sarif` makes each finding a file/line/rule diagnostic in the gate's
  # failure recap; drop it (or use `discern scripts prose-page`) for Vale's
  # human line format.
  [jobs.prose]
    stage = "check"
    run = "deno run --allow-read --allow-write --allow-env --allow-run scripts/prose_check.ts --sarif --custom-zero \"${map.dir}\""
    provides = "docs prose lint (Vale; blocking defects across the non-private Map; registered editorial advice retained for review)"

  [jobs.manual-prose]
    stage = "check"
    run = "deno run --allow-read --allow-write --allow-env --allow-run scripts/manual_prose_check.ts --sarif"
    provides = "product-manual prose lint (published projection; product voice; frontmatter excluded)"

  # `canary` runs the hot, cheap test subset (scripts/canary_registry.ts: the
  # guard/enrolment convention plus registered extras) at the check stage, so
  # `discern prepare` reports a tripped guard in seconds and a red canary ends
  # the Gate's concurrent check/test group early instead of waiting out the
  # full suite. Every member runs again in the test stage: the canary changes
  # when a failure is reported, never what a green gate proves. Deliberately
  # not behind `discern queue` — the queue paces whole-suite runs, and a
  # seconds-scale subset must not wait behind one. Audit membership against
  # recorded failure evidence with `discern scripts canary-audit`. The budget
  # scales the local seconds to the slowest hosted lane, like `test` above. The
  # canary imports the same seeded command and forwards caller arguments.
  [jobs.canary]
    stage = "check"
    run = "deno run --allow-read --allow-env --allow-run scripts/canary_tests.ts"
    provides = "canary tests (hot, cheap subset heard before the full suite)"
    timeout = 600

  # Bound to the module rather than to the `project-control` Project Script that
  # wraps it, like `canary` above: the script namespace is project-owned, so a
  # check stage must not depend on a file the owner may rename or on its
  # executable bit surviving a checkout. `discern scripts project-control` runs
  # the same read-only command by hand.
  [jobs.project-control]
    stage = "check"
    run = "deno run --quiet --no-prompt --allow-read --allow-run=git scripts/project_control_integrity.ts"
    provides = "repository planning, TODO, and documenter control-document integrity"

  [jobs.promise-effects]
    stage = "check"
    run = "deno task promise-effects"
    provides = "type-aware promise-effect ownership and exact deliberate-detachment enrollment"

# Setup coverage counts every known job as applicable unless its lifecycle is
# explicitly absent here. This declaration changes setup accounting only;
# [jobs] remains the sole Gate schedule. Author changes with `discern config
# set-job <known-name> --not-applicable` or `--applicable`; a configured known
# job cannot also appear in this list.

# ─────────────────────────────────────────────────────────────────────────────
# [setup]
#
# What:    Known jobs that do not apply to this project.
# Why:     Setup measures how many applicable known jobs are wired. A lifecycle
#          the project does not have is declared here, so the measure counts
#          what exists; the gate's schedule still comes from [jobs].
#
#   discern config set-job build --not-applicable   declare one
#   discern config set-job build --applicable       restore it
#
# Help:    `discern config explain setup`
# ─────────────────────────────────────────────────────────────────────────────

[setup]
  # Known jobs this project's lifecycle does not have. A job listed here cannot
  # also be configured under [jobs].
  not_applicable = []

# ─────────────────────────────────────────────────────────────────────────────
# [scopes.<name>]
#
# What:    Named regions of the repository.
# Why:     A change inside a scope can skip the gate, run its own gate, or
#          offer a preview. A path that matches no scope counts as code and
#          runs every stage.
#
# Params:  paths, neutral, preview, inputs, needs, artifacts, environment,
#          toolchain, gate, timeout
# Help:    `discern config explain scopes`
# ─────────────────────────────────────────────────────────────────────────────

# Pure documentation: the map and the deferred-work ledger. Needs no gate, and
# [acceptance] pre-authorizes it — green changes here land without a
# conversation. Root-level *.md is always treated as neutral.
[scopes.map]
  paths = [
    "${map.dir}",
    "${project.todo}",
  ]
  neutral = true

# Agent-instruction surfaces: authored instructions and skills, plus the exact
# materialized-skills directories compiled from them. Gate-neutral like the map scope,
# but deliberately outside [acceptance] — instructions steer every future
# session, so landing them always gets owner review. Project Scripts and
# provider-owned sibling files still run the gate.
[scopes.instructions]
  paths = [
    "project/instructions.md",
    "${skills.dir}/",
    ".claude/skills/",
    ".agents/skills/",
  ]
  neutral = true

# The Big Picture: everything meaningful an external reader would want to know
# in order to get themselves up-to-speed with discern. These paths are kept
# inside the Map and are used by the maintainer with `discern map --export`.
# Exact CLI and config reference retired from the Map with the manual split:
# export them from the product manual with `discern docs --export public`.
[scopes.big-picture]
  paths = [
    "${map.dir}_internal/brand/positioning.md",
    "${map.dir}_private/brand/audiences.md",
    "${map.dir}_internal/brand/demand-canon.md",
